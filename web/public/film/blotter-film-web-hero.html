  THE WEB HERO FILM. 1322 x 432.5, 13.00 seconds, seamless loop.

  It is the hero of the desktop landing page. Self-contained: open with file://,
  fonts inlined, no network. `?bare=1` strips the controls, `?t=10.5` renders
  one frame deterministically, `?sweep=in|out` picks the sweep direction.

  ---------------------------------------------------------------------------
  REBUILT ON THE REAL SHEET, 4 SEPTEMBER 2026

  The previous cut drew a product that does not exist. It had `Next move` and
  `Call` columns, no `Attempts`, and it put `No reply` and `Call completed` in
  the `Status` cell. None of those are real. `courier/Code.gs` is the authority
  and this film is now built from it:

    columns   Name, Title, Firm, Email, Status, Days, Last contact, Attempts,
              Next call, Last call, Closed. Widths are `CONTACTS_WIDTHS`.
    statuses  Not emailed, Sent, Replied, Bounced, Call scheduled, Call done,
              Call cancelled, Closed. Eight, and no others.
    theme     `bands`. White data rows, a tinted header, and a 3px yellow rule
              between the student's columns and Blotter's. A status is a filled
              cell with coloured text. It is not a pill and it has no caret.

  The composition is `hero-visual.tsx` at rest, so the film and the static
  version a reduced-motion reader gets are the same sheet, cell for cell. Eight
  of the eleven columns are on screen: `Email` is hidden, the way a student
  hides 190px of addresses they never read, and `Last call` and `Closed` sit off
  the right edge, the way a Sheets window narrower than its sheet cuts off.

  ---------------------------------------------------------------------------
  THE THIRTEEN SECONDS

     0.00 -  1.20  AT REST    The tracker before anything has arrived.

     1.20 -  3.98  A REPLY    Gmail. "Jamie Diamond replied". Row 2 moves:
                              Status Sent to Replied, Days 5 to 0, Attempts 2
                              to a dash, and Last contact catches up to 1/16.
                              Then the cue and its line leave.

     4.14 -  6.98  A FOLLOW-UP  Gmail. "Follow-up sent to Larry Sync". Row 4
                              moves and THE STATUS DOES NOT. It reads `Sent`
                              before and `Sent` after. What moves is Attempts 1
                              to 2, Days 6 to 0, Last contact 1/10 to 1/16.
                              This beat is the reason the `Attempts` column
                              exists, and it is the one a status alone cannot
                              tell you.

     7.14 - 11.50  A COFFEE CHAT  Calendar. "Coffee chat with David Salmon".
                              Row 6: Status Sent to Call scheduled, Next call
                              fills with 1/17 @ 2:00 PM, Days and Attempts both
                              drop to a dash, because neither counts once a call
                              is booked. Then 1.66 measured seconds in which
                              nothing on the canvas changes at all.

    11.50 - 12.20  WIPE       A pale bar travels up the grid and hands each row
                              back whole as its centre passes.

    12.20 - 13.00  AT REST    Identical to 0.00. The seam is frame-exact.

  Every value obeys `web/app/api/engine/rules.ts`. `Days` carries a number on
  `Sent`, `Replied` and `Call done` and a dash everywhere else. `Attempts`
  carries one on `Sent` alone: on `Replied` it is zero by definition, and a
  booked call has nothing to count. So a row moving into `Replied` or into
  `Call scheduled` loses its attempt count, and that is not a gap in the data.

  Beat order builds. A reply, which the reader could have spotted in their own
  inbox. Then a follow-up, which no status on any tracker distinguishes from a
  first email. Then the calendar, which is the second source. The middle beat is
  the argument, and it is the only one where nothing in the `Status` cell moves.

  ---------------------------------------------------------------------------
  THE CUE PLUGS STRAIGHT INTO THE SHEET

  `01-HERO` section 12 removes the vertical Blotter engine, the central
  processor box and the cue-to-engine-to-sheet flow from the hero, and section 9
  forbids oversized arrowheads, animated particles, glowing tubes and a
  spiderweb of lines. Nothing sits between the cue and the sheet.

  Sections 7 and 9 give the device instead, and `hero-visual.tsx` draws it:

      one direct connector per cue, landing on the row it changed, closed by a
      small endpoint node.

  ONE FIXED SLOT. The cue card sits at x 1049, top level with the top of the
  sheet window, and every cue appears in that identical position. Cues do not
  accumulate: a cue arrives, its line draws, its row updates, and the whole cue
  and its line leave before the next one arrives. The static composition stacks
  all three down the right instead, one per row; a film cannot, because three
  cards on screen at once says they happened at once.

  ONE RIGHT ANGLE. The line leaves the underside of the card, drops straight
  down at the centre of the card's source mark, turns once to the left, and runs
  into the target row, closing on a round node at the sheet's right edge. Only
  the length of the drop changes between cues. Mitred corner, no curve, no
  second elbow, no arrowhead.

  ---------------------------------------------------------------------------
  THE CARD SAYS WHICH CELLS MOVED

  `activity-cue.tsx`, reproduced. The card carries what happened on one line and
  then the cells it moved, one per line, column name in its own column. The
  timestamp line it used to carry is gone: a timestamp says when Blotter noticed
  and never says what Blotter did, and the whole claim here is that one event
  moves several columns together. The date is not lost. The row the connector
  points at has `Last contact` in it.

  Every label names a real column and a real value. Nothing on a card describes
  a state the product does not have.

  ---------------------------------------------------------------------------
  WHERE THE GEOMETRY CAME FROM

  Widths are `CONTACTS_WIDTHS` verbatim, and the canvas is `TOTAL_W` by
  `SHEET_H` from `hero-visual.tsx`, which `page-box.tsx` reads. It cannot move.

    sheet window        989 x 432.5       grid top      127
    row height          43.5              last row      42.5 (no bottom border)
    row centres         192.25  235.75  279.25  322.75  365.75
    row gutter          43
    yours               420 (150+120+150)
    Blotter's           526 (132+62+108+82+142)
    corridor            60                cue column    273, x 1049 to 1322
    node                on the sheet's right edge

  Everything the sweep and the connectors depend on is MEASURED off the built
  DOM rather than typed, because the eight columns are flex items that give back
  a pixel or two to fit the sheet's content box, so the boundaries land on
  fractions. `window.GEOMETRY` exposes what the film actually laid out at.

  ---------------------------------------------------------------------------
  THE SWEEP, AND THE A/B

  When a cue lands, the changed cells fill with the Blotter yellow. Two rules:

    1. THE SWEEP NEVER CROSSES THE OWNERSHIP SPLIT. Running a Blotter fill
       across `Name` would say Blotter writes the name, which is the one thing
       the ownership split exists to deny.
    2. THE SWEEP LEAVES NOTHING BEHIND. Once it has passed, the row carries no
       badge, tint or marker.

    ?sweep=in   (default)  the fill enters at the row's right edge, where the
                           line landed, runs right to left, and halts dead on
                           the ownership split.
    ?sweep=out             the fill starts at the split and runs left to right.

  `in` is the default because this film's line arrives from the right, so the
  fill runs with the information rather than against it, and a fill that STOPS
  on a line reads as a boundary more strongly than one that starts there. Press
  `s` to swap live.

  ---------------------------------------------------------------------------
  CLAIM SAFETY

  No price, no availability, no beta, no launch date, no cohort language. No
  marketing line of any kind: the film draws no headline and no tagline, and
  every frame is product. Nothing here writes or drafts outreach. The contacts
  are the seven fictional ones in `section-45/parts.tsx`, five of them here, and
  no real person and no bank logo appears.

  ---------------------------------------------------------------------------
  CONTROLS, not part of the film

    space  play / pause        c  hide the controls for recording
    arrows step one frame      f  fit-to-window / true size
    r      restart             s  swap the sweep direction

/* ------------------------------------------------------------------ tokens */
/* Sampled from web/app/globals.css. Retune there, not here. */
:root{
  --ink:#14181f; --ink-muted:#5f6368; --ink-faint:#a4a8ac;
  --blotter-100:#f7f2e8; --blotter-200:#f3e6c6;
  --blotter-400:#d9b64a; --blotter-500:#c9a227; --blotter-700:#8a6d12;
  --manual-100:#edf2f8; --manual-row:#ffffff;
  --sheet-border:#dadce0; --sheet-grid:#e8eaed;
  --sheet-header:#f8f9fa; --sheet-chrome:#ffffff; --sheet-green:#0f9d58;
  --chip-replied-bg:#d7e7fb; --chip-replied-fg:#1a56a8;

  --sans:"Geist","Geist Fallback",ui-sans-serif,system-ui,sans-serif;
  --sheet-type:Arial,Helvetica,sans-serif;
}

/*
  STATUS_STYLE, copied out of `courier/Code.gs`. Background then text.

  Written as literals rather than as `chip-*` tokens for the reason
  `status-chip.tsx` gives: `globals.css` is missing four of the eight, and half
  a table in tokens with half in hex would be worse than either.
*/
.sfill[data-s="Not emailed"]   {background:#ffffff;color:#a4a8ac}
.sfill[data-s="Bounced"]       {background:#fce8e6;color:#c5221f}
.sfill[data-s="Sent"]          {background:#dfe3e8;color:#3c4043}
.sfill[data-s="Replied"]       {background:#d7e7fb;color:#1a56a8}
.sfill[data-s="Call scheduled"]{background:#e5ddf7;color:#5b3fa8}
.sfill[data-s="Call done"]     {background:#d7f0dd;color:#1e6b34}
.sfill[data-s="Call cancelled"]{background:#fbeacb;color:#8a5a00}
.sfill[data-s="Closed"]        {background:#ffffff;color:#a4a8ac}

/* -------------------------------------------------------------------- shell */
/*
  `line-height:1.5` is load-bearing, not a default. Tailwind's preflight sets it
  on `html`, and every unprefixed size in `sheet-window.tsx` and `sheet-grid.tsx`
  inherits it. It is what makes the grid rows come out at 43.5px and the chrome
  stack come out at 127px without a single height being declared anywhere.
*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0d1117;color:#c9d1d9;font-family:var(--sans);line-height:1.5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:20px;overflow:hidden;-webkit-font-smoothing:antialiased;
}

/*
  BARE IS TRANSPARENT. This film replaces `HeroVisualModule`, which is a
  transparent object sitting directly on the page's `.field-open` gradient. A
  ground of its own would put a second field inside the page's field and make
  the iframe's edges visible.
*/
body.bare{background:transparent;gap:0;padding:0;display:block;overflow:visible}
body.bare .chrome{display:none}
body.bare .stagehold{margin:0}

.stagehold{flex:none;overflow:hidden}
.stagewrap{width:1322px;height:432.5px;transform-origin:top left}

/*
  THE CANVAS IS EXACTLY 1322 x 432.5, which is `TOTAL_W` by `SHEET_H`.

  The stage does NOT clip. The sheet's ratified drop shadow extends about 14px
  below the sheet's own box, and the sheet is the full height of the canvas, so
  in the real page that shadow paints outside this box onto `.field-open`.
  `hero-film.tsx` gives the iframe 16px of headroom for it.
*/
.stage{position:relative;width:1322px;height:432.5px;overflow:visible}

/* Standalone viewing only, and off in bare mode. A neutral approximation of the
   ground the composition sits on, so the file is legible opened on its own. */
.field{position:absolute;left:-60px;right:-60px;top:-90px;bottom:-90px;
  background:linear-gradient(180deg,#f8fafd 0%,#f2f6fb 100%);z-index:0}
body.bare .field{display:none}

/* ========================================================== the cue slot === */
/*
  ONE FIXED SLOT. `activity-cue.tsx`, reproduced to the pixel: 273px wide, 8px
  radius, `px-3 py-[6px]`, a 13px/16px semibold event line over a two-column
  grid of changed cells at 11.5px/14px, and the ratified two-layer shadow.

  Top at y 0, level with the top of the sheet window. The 20px mark column is
  fixed width so the connector's x cannot move between a 20px Gmail mark and a
  19px Calendar one.
*/
.card{position:absolute;left:1049px;top:0;width:273px;z-index:6;
  display:flex;align-items:flex-start;gap:10px;
  padding:6px 12px;border:1px solid var(--sheet-border);border-radius:8px;
  background:var(--sheet-chrome);
  box-shadow:0 1px 2px rgba(60,64,67,.12),0 4px 12px -6px rgba(60,64,67,.22);
  opacity:0;will-change:opacity,transform}
.cmark{width:20px;flex:none;margin-top:1px;display:flex;align-items:center;
  justify-content:center}
.cmark svg{display:block}
.ctext{min-width:0}
.cevent{display:block;font-size:13px;line-height:16px;font-weight:600;
  color:var(--ink);white-space:nowrap}
/*
  One change per line, column names in their own column. Three changes set as
  running text wrap mid-change, and a cue in the margin that cannot be read at a
  glance does not get read. The name column is `max-content`, so `Status` does
  not pay for `Last contact` in a card that has no `Last contact` in it.
*/
.cwhen{display:block;margin-top:2px;font-size:11.5px;line-height:14px;color:var(--ink-muted);white-space:nowrap}

/* ======================================================== the connector ==== */
/*
  One L per cue: down the corridor from the card's source mark, one right angle,
  into the row, closed by a round node on the sheet's right edge.

  `--blotter-500` rather than the static hero's `--blotter-400`: `-400` is tuned
  to be a hairline the eye finds only when it looks for it, which is right for a
  still and wrong for a line that has to be watched arriving.
*/
.wires{position:absolute;left:0;top:0;z-index:5;overflow:visible;
  pointer-events:none}
.wire{fill:none;stroke:var(--blotter-500);stroke-width:2.5;
  stroke-linejoin:miter;stroke-linecap:butt}
.wnode{fill:var(--blotter-500)}

/* ============================================================= the sheet == */
/*
  `sheet-window.tsx` and `sheet-grid.tsx`, reproduced. Arial rather than the page
  font, exactly as `.sheet-type` pins it.

  `font-size:16px` is the page's base, which is what `SheetWindow` inherits: it
  declares no size of its own and only the grid body sets 15px. That distinction
  is worth a quarter of a pixel and it is not academic, because the star beside
  the title carries no size class either.
*/
.sheet{position:absolute;left:0;top:0;width:989px;z-index:2;
  font-family:var(--sheet-type);color:var(--ink);font-size:16px;
  background:var(--sheet-chrome);border:1px solid var(--sheet-border);
  border-radius:12px;overflow:hidden;
  box-shadow:0 1px 3px rgba(60,64,67,.15),0 8px 28px -8px rgba(60,64,67,.25)}

.titlebar{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.gicon{width:32px;height:32px;flex:none;border-radius:6px;
  background:var(--sheet-green);display:grid;place-items:center}
.tmeta{flex:1;min-width:0}
.tname{display:flex;align-items:center;gap:8px}
.tname .ttl{font-size:19px;line-height:1.25}
.tname .star{color:var(--ink-faint)}
.menus{margin-top:2px;display:flex;gap:12px;font-size:13px;color:var(--ink-muted)}
.saved{flex:none;font-size:13px;color:var(--ink-muted)}
.share{flex:none;border-radius:999px;background:var(--chip-replied-bg);
  color:var(--chip-replied-fg);font-size:14px;padding:6px 16px}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:#5f6b7a;
  color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center}

.fbar{margin-top:8px;display:flex;align-items:stretch;font-size:13px;
  border-top:1px solid var(--sheet-grid);border-bottom:1px solid var(--sheet-grid)}
.fcell{width:100px;flex:none;border-right:1px solid var(--sheet-grid);
  padding:6px 12px;display:flex;align-items:center;justify-content:space-between}
.fcell .caret{color:var(--ink-faint)}
.fval{flex:1;padding:6px 12px;display:flex;align-items:center;gap:8px;position:relative}
.fval .fx{font-style:italic;color:var(--ink-faint)}
/*
  The formula bar tracks the cell it points at.

  `hero-visual.tsx` selects E2 with the bar reading `Replied`, which is Jamie
  Diamond's `Status` cell and the exact cell the first beat moves. Holding it
  static would put `Replied` on screen while the cell itself still reads `Sent`:
  a frame that contradicts itself. So the bar flips on the same instant the cell
  does. E, not D, because D is `Email` and is hidden.
*/
.fstack{position:relative;display:inline-block;min-width:70px;height:19.5px}
.fstack .va,.fstack .vb{position:absolute;left:0;top:0;white-space:nowrap;
  will-change:opacity,transform}

.letters{display:flex;background:var(--sheet-header);
  border-bottom:1px solid var(--sheet-grid);font-size:12px;color:var(--ink-muted)}
.letters .gut{width:43px;flex:none;border-right:1px solid var(--sheet-grid)}
.letters .col{border-right:1px solid var(--sheet-grid);text-align:center;
  padding:4px 0;position:relative}
.letters .col:last-child{border-right:0}
/*
  Sheets' hidden-column indicator, from `sheet-window.tsx`: two arrowheads
  facing each other across the boundary. `Email` is hidden, and a gap in the
  letter strip with nothing to explain it reads as a rendering fault.
*/
.hmark{position:absolute;top:50%;right:-6px;transform:translateY(-50%);z-index:10;
  display:flex;align-items:center;gap:1px;color:var(--ink-faint)}
.hmark svg{display:block}

.tabs{display:flex;align-items:center;gap:4px;padding:8px 12px;
  border-top:1px solid var(--sheet-grid);font-size:13px}
.tabs .sym{padding:0 6px;color:var(--ink-muted)}
.tab{border-radius:4px;padding:4px 12px;color:var(--ink-muted);white-space:nowrap}
.tab.on{background:var(--chip-replied-bg);color:var(--chip-replied-fg);font-weight:500}
.tab .tcaret{margin-left:4px;opacity:.6}

/* the grid ---------------------------------------------------------------- */
/*
  The columns are flex items that DO shrink. `CONTACTS_WIDTHS` for these eight
  sum to 946 against a 944px content box, so the browser takes a couple of
  pixels back across them and every boundary lands on a fraction. That is what
  the live page renders, and reproducing the rendering rather than the
  arithmetic is what keeps the split, the sweep and the connectors together.
*/
.grid{position:relative;font-size:15px}
.row{display:flex;border-bottom:1px solid var(--sheet-grid);position:relative}
/*
  `:last-child` cannot do this job: the wipe bar is appended to the grid after
  the rows, so it, and not the last row, is the last child. The class is set in
  the builder. `sheet-grid.tsx` drops the same border with `last:border-b-0`,
  which is what makes the sheet exactly 432.5 tall.
*/
.row.endrow{border-bottom:0}
.gut{width:43px;flex:none;border-right:1px solid var(--sheet-grid);
  background:var(--sheet-header);padding:10px 0;text-align:center;
  font-size:12px;color:var(--ink-muted)}
/*
  Cells are `px-2`, not `px-3`. Sheets leaves about 3px each side, and at `px-3`
  the real widths clip their own content: "Vice President" in a 120px `Title` is
  the first to go.
*/
.cell{padding:10px 8px;white-space:nowrap;overflow:hidden;position:relative;
  background:var(--manual-row)}
/*
  HEADER CELLS DO NOT CLIP, and that is `sheet-grid.tsx`'s behaviour rather than
  an oversight. `overflow-hidden` is on the data cells alone. It matters for
  `Attempts`, whose 15px semibold header is within a pixel or two of its own
  82px column, and which is right-aligned, so any overflow goes left into
  `Last contact`'s padding where there is room.
*/
.hrow .cell{overflow:visible;font-weight:600}
.cell.num{text-align:right}
.cell.ital{font-style:italic;color:var(--ink-muted)}
/*
  THE ZONE BOUNDARY. `bands` in `courier/Code.gs`: a 3px Blotter-yellow rule
  between the columns the student fills and the ones Blotter writes, carried
  through the header and every data row. Name, Title and Firm are yours.
*/
.cell.split{border-left:3px solid var(--blotter-400)}
.hrow .manual{background:var(--manual-100)}
/* The header band alone carries the maintained zone. Data rows stay white,
   which is what `bands` paints and what a student's sheet looks like. */
.hrow .kept{background:var(--blotter-100)}
/* A dash is a value, not a blank, so it takes its column's own alignment. */
.dash{color:var(--ink-faint)}

/*
  THE STATUS CELL IS A FILLED CELL, not a pill.

  `courier/Code.gs` writes the status as conditional formatting on a square
  cell, a fill and a font colour, and says why the rounded Sheets dropdown was
  rejected: Sheets picks the chip's text colour itself, so the exact `fg` of
  each status is lost, and a dropdown on a Blotter-owned column invites a
  student to change a value that gets overwritten fifteen minutes later. "A
  square cell that is always right beats a pill that lies."

  The fill is the whole cell, so the cell gives up its own padding and the fill
  carries the row's instead.
*/
.cell.statuscell{padding:0}
.sfill{display:block;padding:10px 4px;text-align:center;white-space:nowrap}
.statuscell .stack{height:42.5px}
.statuscell .va,.statuscell .vb{display:block;height:42.5px;align-items:stretch}

/*
  A cell that changes holds both values stacked and REPLACES one with the other,
  so the column geometry cannot shift on the frame the value lands. The two
  never overlap: a cross-fade puts one string on top of another, which is a
  smear rather than a transition.
*/
.stack{position:relative;display:block;height:22.5px}
.va,.vb{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;
  height:22.5px;will-change:opacity,transform}
.cell.num .va,.cell.num .vb{justify-content:flex-end}

/*
  THE SWEEP. The moment arriving along the row it changes. Transient, and it is
  not a badge: nothing is left behind on the row once it has passed.

  It spans the Blotter block only, from the ownership rule to the sheet's right
  edge, and `left` and `width` are written from the measured column geometry in
  the script rather than typed here, so a width change cannot silently move it
  into the student's zone.
*/
.sweepwrap{position:absolute;top:0;bottom:0;overflow:hidden;pointer-events:none}
/*
  The wipe bar. A pale band that travels up through the grid at the end of the
  cycle and hands each row back to its opening state as it passes.

  Deliberately not the Blotter yellow: the yellow means "Blotter maintains
  this", and this bar is the film resetting itself rather than anything the
  product does. A soft neutral says housekeeping.
*/
.wipe{
  position:absolute; left:0; right:0; top:0; height:120px;
  pointer-events:none; opacity:0; will-change:transform,opacity;
  background:linear-gradient(to top,
    rgba(255,255,255,0) 0%,
    rgba(238,242,248,0.92) 38%,
    rgba(238,242,248,0.92) 62%,
    rgba(255,255,255,0) 100%);
}
#grid{ position:relative; }
.rowsweep{position:absolute;top:0;bottom:0;width:0;
  background:rgba(201,162,39,.17);will-change:width,opacity}
.rowsweep .lead{position:absolute;top:0;bottom:0;width:3px;
  background:var(--blotter-700)}

/* ------------------------------------------------------------- controls */
.chrome{display:flex;align-items:center;gap:12px;font-size:13px;flex:none}
.chrome button{font:inherit;background:#21262d;color:#c9d1d9;border:1px solid #30363d;
  border-radius:7px;padding:7px 12px;cursor:pointer}
.chrome button:hover{background:#30363d}
.chrome input[type=range]{width:380px;accent-color:#d9b64a}
.chrome .t{font-family:ui-monospace,monospace;color:#8b949e;min-width:112px}
.chrome .hint{color:#6e7681}
</style>
</head>

<body>
<div class="stagehold" id="stagehold">
<div class="stagewrap" id="stagewrap">
<div class="stage" id="stage">
  <div class="field"></div>

  <!-- One shared clip path for the Calendar mark. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><clipPath id="calr"><rect width="20" height="20" rx="2.4"/></clipPath></defs>
  </svg>

  <!-- ============================================================ sheet -->
  <div class="sheet" id="sheet">
    <div class="titlebar">
      <span class="gicon">
        <svg width="15" height="19" viewBox="0 0 15 19" fill="none" aria-hidden="true">
          <path d="M9 0H1.5A1.5 1.5 0 0 0 0 1.5v16A1.5 1.5 0 0 0 1.5 19h12a1.5 1.5 0 0 0 1.5-1.5V6L9 0Z" fill="#fff" fill-opacity=".25"/>
          <path d="M3.5 8.5h8v6h-8v-6Zm1 1.5v1h2.5v-1H4.5Zm3.5 0v1h2.5v-1H8Zm-3.5 2v1h2.5v-1H4.5Zm3.5 0v1h2.5v-1H8Z" fill="#fff"/>
        </svg>
      </span>
      <div class="tmeta">
        <div class="tname"><span class="ttl">IB Recruiting Tracker</span><span class="star">&#9734;</span></div>
        <div class="menus"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span><span>Tools</span><span>Extensions</span><span>Help</span></div>
      </div>
      <span class="saved">All changes saved in Drive</span>
      <span class="share">Share</span>
      <span class="avatar">JN</span>
    </div>

    <div class="fbar">
      <div class="fcell"><span id="fcellref">E2</span><span class="caret">&#9662;</span></div>
      <div class="fval"><span class="fx">fx</span><span class="fstack" id="fstack"></span></div>
    </div>

    <div class="letters" id="letters"></div>
    <div class="grid" id="grid"></div>

    <!-- The four tabs the product ships with. `Contacts` is the one on screen. -->
    <div class="tabs">
      <span class="sym">+</span><span class="sym">&#9776;</span>
      <span class="tab">Start here</span>
      <span class="tab on">Contacts<span class="tcaret">&#9662;</span></span>
      <span class="tab">Found</span>
      <span class="tab">Settings</span>
    </div>
  </div>

  <!-- ======================================================== connector -->
  <svg class="wires" id="wires" width="1322" height="432.5"
       viewBox="0 0 1322 432.5" aria-hidden="true"></svg>

  <!-- ========================================================= cue slot -->
  <div id="cards"></div>
</div>
</div>
</div>

<div class="chrome">
  <button id="play">Pause</button>
  <input type="range" id="scrub" min="0" max="13000" value="0" step="1">
  <span class="t" id="clock">0.00 / 13.00</span>
  <button id="btnG">Reply</button>
  <button id="btnF">Follow-up</button>
  <button id="btnC">Coffee chat</button>
  <button id="btnH">Settled</button>
  <button id="btnSweep">Sweep: in</button>
  <button id="btnFit">True size</button>
  <span class="hint">space play &middot; arrows step &middot; s swap sweep &middot; c clean &middot; f true size &middot; r restart</span>
</div>

<script>
"use strict";

/* =========================================================================
   CANONICAL DATA. Nothing here may be edited without a ruling.

   Columns and widths are `CONTACTS_WIDTHS` in `courier/Code.gs`, in header
   order. `Email` is hidden; `Last call` and `Closed` are off the right edge.

   The `to` values are `HERO_ROWS` in `hero-visual.tsx` exactly, so the film
   converges on the composition a reduced-motion reader is served instead of it.
   The opening values are those end states with the three events undone, and
   every one of them obeys `web/app/api/engine/rules.ts`.

   JEROME BOWEL AND KEN MOLISE NEVER MOVE. They are there so the sheet reads as
   a tracker rather than as a three-row demonstration, and between them they put
   a second `Sent` row and a `Call done` row on screen for the whole film.
   ========================================================================= */

const COLS = [
  { key:"name",     head:"Name",         w:150, kept:false },
  { key:"title",    head:"Title",        w:120, kept:false, ital:true },
  { key:"firm",     head:"Firm",         w:150, kept:false },
  { key:"status",   head:"Status",       w:132, kept:true, status:true },
  { key:"days",     head:"Days",         w:62,  kept:true, num:true },
  { key:"last",     head:"Last contact", w:108, kept:true },
  { key:"attempts", head:"Attempts",     w:82,  kept:true, num:true },
  { key:"next",     head:"Next call",    w:142, kept:true },
];
/* The real letters in the eleven-column sheet. D is `Email`, hidden. */
const LETTERS = ["A","B","C","E","F","G","H","I"];
const HIDDEN_AFTER = ["C"];
const SPLIT_I = COLS.findIndex(c => c.kept);   /* 3 */

/* An em dash, `NO_CLOCK` in Code.gs. Not a hyphen and not a blank: a blank cell
   reads as "Blotter has not run", a dash reads as "there is nothing to count
   here". A leading hyphen is also how you start a formula. */
const DASH = { dash:true };

const ROWS = [
  /* Beat 1. They wrote back, so the clock resets and the count of times you
     have written since they last wrote drops to nothing. `Last contact` moves
     with it, because the reply IS the last contact. */
  { name:"Jamie Diamond", title:"Associate", firm:"JPMorgan",
    status:"Sent", days:"5", last:"1/11/26", attempts:"2", next:"",
    to:{ status:"Replied", days:"0", last:"1/16/26", attempts:DASH } },

  { name:"Jerome Bowel", title:"Analyst", firm:"Carlyle",
    status:"Sent", days:"3", last:"1/13/26", attempts:"1", next:"" },

  /* Beat 2, and the reason `Attempts` is a column. `to` deliberately carries no
     `status`: that cell is built as static text and there is no second value in
     it for any code path to reach, so it reads `Sent` on every frame of the
     film while three cells beside it move. */
  { name:"Larry Sync", title:"Associate", firm:"BlackRock",
    status:"Sent", days:"6", last:"1/10/26", attempts:"1", next:"",
    to:{ days:"0", last:"1/16/26", attempts:"2" } },

  { name:"Ken Molise", title:"Vice President", firm:"Moelis",
    status:"Call done", days:"1", last:"1/13/26", attempts:DASH, next:"" },

  /* Beat 3. `Days` was the one state counting forwards, so a booked call drops
     it and `Next call` carries the date instead. `Attempts` goes with it: the
     count means something on `Sent` and nowhere else. */
  { name:"David Salmon", title:"Analyst", firm:"Goldman Sachs",
    status:"Sent", days:"1", last:"1/15/26", attempts:"1", next:"",
    to:{ status:"Call scheduled", days:DASH, attempts:DASH,
         next:"1/17 @ 2:00 PM" } },
];

/*
  The three cues, in this order, each in the one fixed slot. They are
  `HERO_CUES` in `hero-visual.tsx`, verbatim, down to which cells each card
  names, so the film and the static composition tell one story.

  One inbound, one outbound, one from Calendar. Cue order matches row order, so
  the three connectors never cross.
*/
const CUES = [
  { id:"reply", row:0, source:"gmail",
    event:"Jamie Diamond replied",
    when:"Jan 16 · 10:42 AM",
    moved:[ { column:"Status",   from:"Sent", to:"Replied" },
            { column:"Days",     from:"5",    to:"0" },
            { column:"Attempts", from:"2",    to:"—" } ] },

  { id:"followup", row:2, source:"gmail",
    event:"Follow-up sent to Larry Sync",
    when:"Jan 16 · 9:15 AM",
    moved:[ { column:"Attempts",     from:"1",    to:"2" },
            { column:"Days",         from:"6",    to:"0" },
            { column:"Last contact", from:"1/10", to:"1/16" } ] },

  { id:"chat", row:4, source:"calendar",
    event:"Coffee chat with David Salmon",
    when:"Jan 15 · 4:20 PM",
    moved:[ { column:"Status",    from:"Sent", to:"Call scheduled" },
            { column:"Next call",              to:"1/17 @ 2:00 PM" },
            { column:"Days",      from:"1",    to:"—" } ] },
];

/* The selected cell and its two formula-bar values. E2 is Jamie Diamond's
   `Status` cell, which is what the first beat moves. */
const SHEET = { ref:"E2", formulaFrom:"Sent", formulaTo:"Replied" };

/* =========================================================================
   MARKS, verbatim from web/components/google-marks.tsx
   ========================================================================= */

const GMAIL_SVG = '<svg width="20" height="15" viewBox="0 0 24 18" aria-hidden="true">'
  + '<path d="M1.64 18h3.27V9.95L0 6.27v10.09C0 17.27.73 18 1.64 18Z" fill="#4285F4"/>'
  + '<path d="M19.09 18h3.27c.9 0 1.64-.73 1.64-1.64V6.27l-4.91 3.68V18Z" fill="#34A853"/>'
  + '<path d="M19.09 1.64v8.31L24 6.27V2.45c0-1.52-1.73-2.38-2.95-1.47l-1.96 1.47Z" fill="#FBBC04"/>'
  + '<path d="M4.91 9.95V1.64L12 6.95l7.09-5.31v8.31L12 15.27 4.91 9.95Z" fill="#EA4335"/>'
  + '<path d="M0 2.45v3.82l4.91 3.68V1.64L2.95.98C1.73.07 0 .93 0 2.45Z" fill="#C5221F"/></svg>';

const CAL_SVG = '<svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">'
  + '<g clip-path="url(#calr)">'
  + '<rect width="20" height="20" fill="#4285F4"/>'
  + '<rect x="15.6" width="4.4" height="4.4" fill="#1967D2"/>'
  + '<rect x="15.6" y="4.4" width="4.4" height="11.2" fill="#FBBC04"/>'
  + '<rect y="15.6" width="4.4" height="4.4" fill="#188038"/>'
  + '<rect x="4.4" y="15.6" width="11.2" height="4.4" fill="#34A853"/>'
  + '<rect x="15.6" y="15.6" width="4.4" height="4.4" fill="#EA4335"/>'
  + '<rect x="4.4" y="4.4" width="11.2" height="11.2" fill="#ffffff"/>'
  + '<text x="10" y="13.6" text-anchor="middle" font-size="9.4" font-weight="500"'
  + ' fill="#4285F4" font-family="Arial, Helvetica, sans-serif">31</text>'
  + '</g></svg>';

/* `sheet-window.tsx`'s hidden-column indicator. */
const HIDDEN_MARK = '<span class="hmark" aria-hidden="true">'
  + '<svg width="4" height="7" viewBox="0 0 4 7" fill="currentColor"><path d="M4 0 0 3.5 4 7z"/></svg>'
  + '<svg width="4" height="7" viewBox="0 0 4 7" fill="currentColor"><path d="M0 0l4 3.5L0 7z"/></svg>'
  + '</span>';

/* =========================================================================
   BUILD
   ========================================================================= */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

/* `?sweep=out` runs the fill left to right. Anything else, including nothing,
   is `in`. See the header comment for why `in` is the default. */
let sweepMode = params.get("sweep") === "out" ? "out" : "in";

(function letters(){
  $("letters").innerHTML = '<div class="gut"></div>' + COLS.map((c,i) =>
    `<div class="col" style="width:${c.w}px">${LETTERS[i]}`
    + (HIDDEN_AFTER.includes(LETTERS[i]) ? HIDDEN_MARK : "")
    + `</div>`).join("");
})();

function valueHTML(col, v){
  if (v === "" || v === null || v === undefined) return "";
  if (v && v.dash) return '<span class="dash">—</span>';
  if (col.status) return `<span class="sfill" data-s="${v}">${v}</span>`;
  return v;
}

const flips  = [];      /* flips[r][key] = {va, vb, cell} for every moving cell */
const rowEls = [];
const rowSweeps = [];
const sweepWraps = [];

(function grid(){
  const el = $("grid");

  const h = document.createElement("div");
  h.className = "row hrow";
  h.innerHTML = '<div class="gut">1</div>' + COLS.map((c,i) => {
    const cls = ["cell", c.kept ? "kept" : "manual", i===SPLIT_I ? "split" : "",
                 c.num ? "num" : ""].join(" ");
    return `<div class="${cls}" style="width:${c.w}px">${c.head}</div>`;
  }).join("");
  el.appendChild(h);

  ROWS.forEach((r, ri) => {
    const row = document.createElement("div");
    row.className = ri === ROWS.length - 1 ? "row endrow" : "row";
    const f = {};
    row.innerHTML = '<div class="gut">' + (ri+2) + '</div>' + COLS.map((c,i) => {
      const cls = ["cell", i===SPLIT_I ? "split" : "", c.num ? "num" : "",
                   c.status ? "statuscell" : "", c.ital ? "ital" : ""].join(" ");
      /* A cell only becomes a stack if this row's `to` names it. Larry Sync's
         `status` is absent from his `to`, so it is built as static text. */
      const moves = r.to && r.to[c.key] !== undefined;
      const inner = moves
        ? `<span class="stack" data-k="${c.key}">`
            + `<span class="va">${valueHTML(c, r[c.key])}</span>`
            + `<span class="vb">${valueHTML(c, r.to[c.key])}</span>`
          + `</span>`
        : valueHTML(c, r[c.key]);
      return `<div class="${cls}" style="width:${c.w}px">${inner}</div>`;
    }).join("")
      + '<div class="sweepwrap"><div class="rowsweep"><span class="lead"></span></div></div>';
    el.appendChild(row);

    [...row.querySelectorAll(".stack")].forEach(s => {
      f[s.dataset.k] = { va:s.querySelector(".va"), vb:s.querySelector(".vb"),
                         cell:s.parentElement };
    });
    flips.push(f);
    rowEls.push(row);
    rowSweeps.push(row.querySelector(".rowsweep"));
    sweepWraps.push(row.querySelector(".sweepwrap"));
  });
})();

(function formulaBar(){
  $("fcellref").textContent = SHEET.ref;
  $("fstack").innerHTML = `<span class="va">${SHEET.formulaFrom}</span>`
                        + `<span class="vb">${SHEET.formulaTo}</span>`;
})();
const fbar = { va:$("fstack").querySelector(".va"), vb:$("fstack").querySelector(".vb") };

(function cards(){
  $("cards").innerHTML = CUES.map(c => {
    const mark = c.source === "calendar" ? CAL_SVG : GMAIL_SVG;
    return `<div class="card" id="card-${c.id}">`
      + `<span class="cmark">${mark}</span>`
      + `<span class="ctext">`
      +   `<span class="cevent">${c.event}</span>`
      +   `<span class="cwhen">${c.when}</span>`
      + `</span></div>`;
  }).join("");
})();
const cardEls = CUES.map(c => $("card-" + c.id));

/* =========================================================================
   MEASURED GEOMETRY

   Read off the built DOM rather than typed: the eight columns shrink to fit the
   sheet's content box, so every boundary lands on a fraction and the arithmetic
   is a pixel or two out. The connectors and the sweep are driven from what is
   actually painted.
   ========================================================================= */

/*
  Two coordinate spaces, and conflating them is a one-pixel bug.

  The connector lives in the svg, which spans the STAGE. The sweep lives inside
  a row, whose origin is a pixel to the right of the stage's because the sheet
  has a 1px border. So `pxIn` takes the element to measure against.

  Both divide out whatever scale the stage is currently under, so a measurement
  is a canvas measurement whether or not `fit()` has run yet.
*/
const STAGE_K = (() => { const b = $("stage").getBoundingClientRect();
                         return b.width / 1322 || 1; })();
const pxIn = (el, origin) => {
  const o = origin.getBoundingClientRect(), b = el.getBoundingClientRect();
  return { x:(b.left-o.left)/STAGE_K, y:(b.top-o.top)/STAGE_K,
           w:b.width/STAGE_K, h:b.height/STAGE_K };
};
const px = el => pxIn(el, $("stage"));

/* Row centres, in canvas coordinates: what the connector endpoints need. */
const ROW_MID = rowEls.map(el => { const b = px(el); return b.y + b.h / 2; });

/* The ownership rule and the right edge of the Blotter block, measured off the
   header row's own cells so the sweep can never drift from the rule, and in
   GRID coordinates because that is the space the sweep is positioned in. */
const hdrRow   = $("grid").firstElementChild;
const hdrCells = [...hdrRow.querySelectorAll(".cell")];
const SPLIT_X  = pxIn(hdrCells[SPLIT_I], hdrRow).x;
const KEPT_END = (() => { const b = pxIn(hdrCells[COLS.length-1], hdrRow);
                          return b.x + b.w; })();
const SWEEP_W  = KEPT_END - SPLIT_X;

/* The same edge in canvas coordinates, for the verification pass. The sweep
   must never go left of this. */
const SPLIT_CANVAS = px(hdrCells[SPLIT_I]).x;

/* Where each Blotter column's content sits inside the sweep, as an x offset
   from the rule. A value flips when the leading edge is 35% into its own
   column, halfway into a centred `Status` fill, or 52% into a right-aligned
   number, which has its content at the far end. Same anchor in both sweep
   directions; only the progress that reaches it is measured from the other
   side. */
const FLIP_X = {};
COLS.forEach(c => {
  if (!c.kept) return;
  const b = pxIn(hdrCells[COLS.indexOf(c)], hdrRow);
  const anchor = c.status ? 0.50 : c.num ? 0.52 : 0.35;
  FLIP_X[c.key] = (b.x - SPLIT_X) + b.w * anchor;
});

/* The connector. One L per cue: down the corridor at the centre of the card's
   source mark, one right angle, into the row, closed on the sheet's edge. */
const CARD_BOTTOM = px(cardEls[0]).y + px(cardEls[0]).h;
const STEM_X      = (() => { const b = px(cardEls[0].firstElementChild);
                             return b.x + b.w / 2; })();
const SHEET_EDGE  = (() => { const b = px($("sheet")); return b.x + b.w; })(); /* 989 */

const NODE_R = 5;

const wires = CUES.map(c => {
  const ry = ROW_MID[c.row];
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("class", "wire");
  p.setAttribute("d", `M ${STEM_X} ${CARD_BOTTOM} L ${STEM_X} ${ry} L ${SHEET_EDGE} ${ry}`);
  const n = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  n.setAttribute("class", "wnode");
  n.setAttribute("cx", SHEET_EDGE); n.setAttribute("cy", ry); n.setAttribute("r", NODE_R);
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.appendChild(p); g.appendChild(n);
  $("wires").appendChild(g);
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  return { g, path:p, node:n, len };
});

/* Everything the composition was actually laid out at, in canvas coordinates,
   so a verification pass reads the film's own measurements rather than
   re-deriving them and agreeing with itself. */
window.GEOMETRY = {
  splitCanvasX: SPLIT_CANVAS, splitGridX: SPLIT_X,
  keptEndGridX: KEPT_END, sweepW: SWEEP_W,
  rowMid: ROW_MID, cardBottom: CARD_BOTTOM, stemX: STEM_X,
  sheetEdge: SHEET_EDGE, nodeR: NODE_R, flipX: FLIP_X, dur: 13.00,
};

/* The sweep spans the Blotter block exactly, and which end it grows from is the
   A/B. Applied on mode change rather than per frame. */
function applySweepMode(){
  sweepWraps.forEach(w => { w.style.left = SPLIT_X + "px"; w.style.width = SWEEP_W + "px"; });
  rowSweeps.forEach(s => {
    const lead = s.querySelector(".lead");
    if (sweepMode === "out") { s.style.left = "0px";  s.style.right = "auto";
                               lead.style.right = "0px"; lead.style.left = "auto"; }
    else                     { s.style.left = "auto"; s.style.right = "0px";
                               lead.style.left = "0px";  lead.style.right = "auto"; }
  });
  const b = $("btnSweep"); if (b) b.textContent = "Sweep: " + sweepMode;
}
applySweepMode();

/* =========================================================================
   TIMELINE. Every visible property is a pure function of t, so scrubbing back
   is identical to playing forward and `?t=` is reproducible.
   ========================================================================= */

const DUR = 13.00;

/*
  THE WIPE.

  The film used to play once and stop, and the embed cross-faded to the static
  hero. Jon rejected that outright: "It's either it's the film, and it goes to
  the static permanently, or it's the film, and it indefinitely loops. And I'm
  in favor of it indefinitely looping like we do on mobile."

  So the bar travels up through the grid, and each row is handed back WHOLE at
  the instant the bar's centre reaches it, which is what keeps a row from ever
  being half of one state and half of the other.

  Both ends of the cycle are exactly zero, so the seam is frame-identical.

    9.84 - 11.50  STILL    nothing on the canvas changes. The beat.
   11.50 - 12.20  WIPE     the bar travels up; rows hand back as it passes.
   12.20 - 13.00  AT REST  identical to 0.00 - 1.20.
*/
const WIPE = [11.50, 12.20];

/** Height of the wipe bar, and how sharply a row hands back behind it. */
const WIPE_H = 120;
const WIPE_RAMP = 0.14;

/*
  The wipe bar and the geometry that drives it.

  Measured from the built grid rather than assumed, so a row-height change
  cannot desynchronise a row's revert from the bar that is supposed to cause it.
  `GRID_H + WIPE_H` is the full travel: the bar starts entirely below the grid
  and finishes entirely above it, so every row is crossed exactly once.
*/
const wipeEl = document.createElement("div");
wipeEl.className = "wipe";
$("grid").appendChild(wipeEl);

const GRID_H = $("grid").offsetHeight;
const WIPE_TRAVEL = GRID_H + WIPE_H;
const ROW_MID_LOCAL = rowEls.map(el => el.offsetTop + el.offsetHeight / 2);
const wipeAt = r => (GRID_H + WIPE_H / 2 - ROW_MID_LOCAL[r]) / WIPE_TRAVEL;

/*
  Per beat: the card arrives, the connector draws itself down the corridor and
  closes on its node, a sweep runs the row that changes, and, for the first two
  beats, the whole cue and its line leave. The cards share one slot and must
  never coexist, so every beat pays for its own exit.

  `out` on the third beat runs with the wipe rather than before it, so the last
  thing to go is the thing the beat is about.
*/
const BEATS = [
  { /* Reply       */ card:[1.20,1.52], wire:[1.58,2.10], node:[2.06,2.26],
                      sweep:[2.38,3.10], sweepOut:[3.10,3.34], out:[3.52,3.98] },
  { /* Follow-up   */ card:[4.14,4.46], wire:[4.52,5.10], node:[5.06,5.26],
                      sweep:[5.38,6.10], sweepOut:[6.10,6.34], out:[6.52,6.98] },
  { /* Coffee chat */ card:[7.14,7.54], wire:[7.62,8.32], node:[8.28,8.52],
                      sweep:[8.68,9.58], sweepOut:[9.58,9.84],
                      out:[11.50,11.90] },
];

/* Everything after 9.84 is stillness: not one property on the canvas changes
   between there and the wipe. That is the beat, and it is why the film is
   thirteen seconds rather than ten. */
const STILL_FROM = 9.84;

const cl = u => u < 0 ? 0 : u > 1 ? 1 : u;
const ss = u => { u = cl(u); return u*u*(3-2*u); };
const seg = (t,[a,b]) => ss((t-a)/(b-a));
const band = (t,i,o) => o ? Math.min(seg(t,i), 1 - seg(t,o)) : seg(t,i);

/*
  How far a cell has moved from its opening value to its ratified one. It
  advances when the sweep's leading edge reaches it, and it retreats when the
  wipe bar passes back over it in the other direction.
*/
const FLIP_DUR = 0.26;

/* A cell REPLACES its value. The old one is gone before the new one starts,
   with a beat of empty cell between them, which is also what a spreadsheet
   cell actually does. */
const outOpacity = m => 1 - ss(m / 0.42);
const inOpacity  = m => ss((m - 0.52) / 0.48);

function mix(t, beat, key){
  const B = BEATS[beat];
  /* In `out` the edge starts at the rule, so a column's progress is its
     distance from the rule. In `in` the edge starts at the sheet's right edge,
     so it is the distance back from there. */
  const u  = sweepMode === "out" ? FLIP_X[key] / SWEEP_W
                                 : (SWEEP_W - FLIP_X[key]) / SWEEP_W;
  const at = B.sweep[0] + (B.sweep[1] - B.sweep[0]) * u;
  const advance = seg(t, [at, at + FLIP_DUR]);

  /* The row is handed back whole, when the wipe bar's centre reaches it.
     Every cell in the row shares this instant. */
  const w0 = WIPE[0] + (WIPE[1] - WIPE[0]) * wipeAt(CUES[beat].row);
  const retreat = seg(t, [w0, w0 + WIPE_RAMP]);
  return cl(advance - retreat);
}

function render(t){
  /* Wrapped rather than clamped: the film loops, so there is no end to hold at
     and `?t=` stays deterministic for any value. */
  const T = ((t % DUR) + DUR) % DUR;

  /* ------------------------------------------------- cue cards and wires */
  BEATS.forEach((B, i) => {
    const live = band(T, B.card, B.out);
    cardEls[i].style.opacity = live;
    cardEls[i].style.transform = `translateY(${(1-live) * 6}px)`;

    const w = wires[i];
    /* The line draws itself from the card down to the sheet, one continuous
       stroke through its single right angle. */
    const drawn = seg(T, B.wire);
    w.path.style.strokeDashoffset = w.len * (1 - drawn);

    /* The node closes the connector where it meets the sheet, the way the
       hero's does. It overshoots by a tenth on arrival and settles, so the line
       reads as landing rather than as having always been there. */
    const n = seg(T, B.node);
    w.node.style.opacity = n;
    const s = n * (1.10 - 0.10 * ss(cl((n - 0.6) / 0.4)));
    w.node.setAttribute("transform",
      `translate(${SHEET_EDGE} ${ROW_MID[CUES[i].row]}) scale(${s}) translate(${-SHEET_EDGE} ${-ROW_MID[CUES[i].row]})`);

    w.g.style.opacity = B.out ? (1 - seg(T, B.out)) : 1;
  });

  /* ------------------------------------------------------------ the sweeps */
  const swept   = ROWS.map(() => 0);
  const sweptOp = ROWS.map(() => 0);
  BEATS.forEach((B, i) => {
    const r = CUES[i].row;
    swept[r]   = seg(T, B.sweep) * (seg(T, B.sweepOut) < 1 ? 1 : 0);
    sweptOp[r] = band(T, [B.sweep[0], B.sweep[0] + 0.06], B.sweepOut);
  });
  rowSweeps.forEach((s, r) => {
    s.style.width = (swept[r] * SWEEP_W) + "px";
    s.style.opacity = sweptOp[r];
  });

  /* --------------------------------------------------------- the cell moves */
  BEATS.forEach((B, i) => {
    const f = flips[CUES[i].row];
    for (const key in f) {
      const m = mix(T, i, key);
      const c = f[key];
      const o = outOpacity(m), n = inOpacity(m);
      c.va.style.opacity = o;
      c.va.style.transform = `translateY(${(1-o) * -6}px)`;
      c.vb.style.opacity = n;
      c.vb.style.transform = `translateY(${(1-n) * 6}px)`;
      /* A short breath on the cell that just moved, in the same yellow. It
         rises with the value and is gone well before the beat ends, so NOTHING
         IS LEFT MARKING THE ROW. */
      const heat = Math.sin(cl(m) * Math.PI) * 0.16;
      c.cell.style.background = heat > 0.001
        ? `rgba(201,162,39,${heat.toFixed(4)})` : "";
    }
  });

  /* The formula bar moves with the cell it points at, on the same instant. */
  const fm = mix(T, 0, "status");
  const fo = outOpacity(fm), fn = inOpacity(fm);
  fbar.va.style.opacity = fo;
  fbar.va.style.transform = `translateY(${(1-fo) * -6}px)`;
  fbar.vb.style.opacity = fn;
  fbar.vb.style.transform = `translateY(${(1-fn) * 6}px)`;

  /* ---------------------------------------------------------------- the wipe */
  const wv = seg(T, WIPE);
  wipeEl.style.opacity = band(T, [WIPE[0], WIPE[0] + 0.10], [WIPE[1] - 0.14, WIPE[1]]);
  wipeEl.style.transform = `translateY(${GRID_H - wv * WIPE_TRAVEL}px)`;
}

/* =========================================================================
   DRIVER
   ========================================================================= */

let playing = true, t = 0, last = performance.now();
const scrub = $("scrub"), clock = $("clock"), play = $("play");
scrub.max = Math.round(DUR * 1000);

function frame(now){
  if (playing) {
    t += (now - last) / 1000;
    if (t >= DUR) t -= DUR;
    scrub.value = Math.round(t * 1000);
  }
  last = now;
  render(t);
  clock.textContent = t.toFixed(2) + " / " + DUR.toFixed(2);
  requestAnimationFrame(frame);
}

scrub.addEventListener("input", () => {
  playing = false; play.textContent = "Play"; t = +scrub.value / 1000;
});
play.addEventListener("click", () => {
  playing = !playing; play.textContent = playing ? "Pause" : "Play";
});

let trueSize = false;
let lastK = 1;
function fit(){
  const wrap = $("stagewrap"), hold = $("stagehold");
  const bare = document.body.classList.contains("bare");
  const pad = bare ? 0 : 110;
  const availW = innerWidth  - (bare ? 0 : 40);
  const availH = innerHeight - pad;
  /*
    A DEGENERATE VIEWPORT MUST NOT PRODUCE A NEGATIVE SCALE, and this is not a
    hypothetical. An iframe inside a `display:none` subtree reports `innerWidth`
    and `innerHeight` of 0, which is exactly the pattern `hero-film.tsx` uses to
    keep the mobile film off desktop. A negative scale is a 180-degree rotation
    plus a mirror, not a small film.

    So the last good scale is held until the viewport actually has a size, and
    the resize that gives it one does the fitting.
  */
  const k = trueSize ? 1
    : (availW > 0 && availH > 0)
      ? Math.min(1, availW / 1322, availH / 432.5)
      : lastK;
  lastK = k;
  wrap.style.transform = `scale(${k})`;
  hold.style.width  = (1322 * k) + "px";
  hold.style.height = (432.5 * k) + "px";
}
addEventListener("resize", fit);

function swapSweep(){
  sweepMode = sweepMode === "out" ? "in" : "out";
  applySweepMode();
  render(t);
}

$("btnFit").addEventListener("click", () => { trueSize = !trueSize; fit(); });
$("btnSweep").addEventListener("click", swapSweep);
$("btnG").addEventListener("click", () => window.renderAt(2.90));
$("btnF").addEventListener("click", () => window.renderAt(5.90));
$("btnC").addEventListener("click", () => window.renderAt(9.20));
$("btnH").addEventListener("click", () => window.renderAt(STILL_FROM + 0.6));

addEventListener("keydown", e => {
  const step = 1 / 30;
  if (e.code === "Space") { e.preventDefault(); play.click(); }
  else if (e.key === "ArrowRight") { window.renderAt(Math.min(t + step, DUR)); }
  else if (e.key === "ArrowLeft")  { window.renderAt(Math.max(t - step, 0)); }
  else if (e.key === "r") { t = 0; playing = true; play.textContent = "Pause"; last = performance.now(); }
  else if (e.key === "s") { swapSweep(); }
  else if (e.key === "c") { document.body.classList.toggle("bare"); fit(); }
  else if (e.key === "f") { trueSize = !trueSize; fit(); }
});

/*
  Deterministic single-frame access, for capture and for inspecting a beat.
  `render` is a pure function of t, so this gives exactly the frame the player
  would show. Exposed because requestAnimationFrame is throttled in a background
  tab and any capture tool would otherwise read a stale frame.
*/
window.renderAt = function (sec) {
  playing = false; play.textContent = "Play";
  t = Math.max(0, Math.min(DUR, sec));
  scrub.value = Math.round(t * 1000);
  render(t);
  clock.textContent = t.toFixed(2) + " / " + DUR.toFixed(2);
  return t;
};

/*
  Embedded use.

    ?bare=1        strips the controls and the ground so the film sits in the
                   page as an asset rather than as a player
    ?t=10.5        opens on one frame, deterministically. Any t from 9.84 to
                   11.50 is the settled tracker, which is `HERO_ROWS` exactly.
    ?sweep=in|out  the A/B, handled above

  All three compose.
*/
if (params.get("bare") !== null) document.body.classList.add("bare");
const q = params.get("t");

fit();
if (q !== null) {
  window.renderAt(+q);
} else if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  /* A reader who has asked for reduced motion gets the settled frame rather
     than the film, even if the host forgot to serve them the still. */
  window.renderAt(10.50);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
