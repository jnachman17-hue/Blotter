name: Materialize Section 3 exact asset

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-section3-asset.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify exact asset
        shell: bash
        run: |
          set -euo pipefail
          asset_dir='blotter-ib-ws1/docs/workstreams/ws5-assets/section-3'
          parts_dir="$asset_dir/.materialize"
          output="$asset_dir/how-blotter-works-exact-v1.avif"
          cat "$parts_dir"/*.b64 | base64 --decode > "$output"
          echo '96fc9213dcd55072082499409153563dbe56c82fe815781ba13fec34424a45b0  '"$output" | sha256sum --check --strict

      - name: Commit materialized asset and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blotter-ib-ws1/docs/workstreams/ws5-assets/section-3/how-blotter-works-exact-v1.avif
          git rm -r blotter-ib-ws1/docs/workstreams/ws5-assets/section-3/.materialize
          git rm .github/workflows/materialize-section3-asset.yml
          git commit -m 'Materialize exact Section 3 asset'
          git push origin HEAD:main
