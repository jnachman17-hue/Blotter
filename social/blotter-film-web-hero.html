  THE WEB HERO FILM. 1322 x 432.5, 11.50 seconds, plays once and HOLDS.

  It replaces the static composition `web/components/hero/hero-visual.tsx` draws
  as the hero of the desktop landing page. Self-contained: open with file://,
  fonts inlined, no network. `?bare=1` strips the controls, `?t=11.5` renders
  one frame deterministically, `?sweep=in|out` picks the sweep direction.

  ---------------------------------------------------------------------------
  WHAT IT IS

  A recruiting tracker in a Google Sheet maintaining itself. Three pieces of
  activity arrive one at a time — an email reply, a completed meeting, and then
  nothing at all for five days — and each rewrites the right-hand half of one
  row while the left-hand half is never touched.

  It sits directly under the ratified headline "Your networking keeps moving.
  Your tracker does not." and answers that headline and nothing else. No intro
  card, no end card, no wordmark, no closing line. EVERY FRAME IS PRODUCT.

  It does NOT loop and it does NOT wipe back. Film C's wipe returns every row
  to its opening state so its loop seams frame-exactly; here the resting frame
  would be the tracker before anything arrived, which is the worst possible
  still under a headline about stale trackers. This film holds on its end state,
  which is `HERO_ROWS` exactly, and that held frame is what the page serves as
  its static hero.

  ---------------------------------------------------------------------------
  THE ELEVEN AND A HALF SECONDS

     0.00 -  1.20  AT REST    The tracker before anything has arrived.

     1.20 -  3.98  GMAIL      "Sarah Chen replied", Jan 16 10:42 AM. The cue
                              plugs into row 2 and four cells move: Sent ->
                              Replied, Next move fills to Reply to Sarah,
                              1/13/26 -> 1/16/26, Days 3 -> 0. Then the cue and
                              its line LEAVE.

     4.14 -  6.98  CALENDAR   "Coffee chat with Priya Shah", Jan 16 11:00 AM.
                              Five cells: Call scheduled -> Call completed,
                              Attend coffee chat -> Send thank-you, 1/15/26 ->
                              1/16/26, Days 1 -> 0, and the scheduled call
                              becomes Completed 1/16. The cue leaves.

     7.14 - 11.50  SILENCE    "No reply for 5 days", Day 5 - No new activity,
                              with the muted Gmail mark. NOTHING ARRIVES and the
                              row moves anyway: Sent -> No reply, Next move
                              fills to Bump thread, Days 4 -> 5 — while LAST
                              CONTACT SITS AT 1/11/26 AND DOES NOT MOVE. Then
                              1.66 measured seconds in which nothing on the
                              canvas changes at all, and the film holds there
                              with this cue, its line and its node still on
                              screen.

  Beat order builds. Two beats where activity arrives, then one where nothing
  does and the tracker moves anyway. The third is the differentiator, so the
  film ends on it and it gets the most time: 4.36s against 2.78 and 2.84.

  ---------------------------------------------------------------------------
  THE FROZEN CELL IS THE SILENCE BEAT

  On a phone the silence beat had to be argued with a counter alone, because
  `Last contact` was not on screen. Here it is on screen, one column to the left
  of `Days`, and you can watch Days climb to 5 while Last contact sits perfectly
  still right beside it. A CELL VISIBLY NOT CHANGING IS THE EVIDENCE THAT
  NOTHING ARRIVED.

  It is frozen structurally rather than by timing: Daniel's row carries no
  `to.last` value at all, so there is no second value in that cell for any
  code path to reach. The sweep passes straight over it and it does not move.

  Daniel opening on the grey `Sent` pill is Jon's override from an earlier Film
  C cut, recorded in `social/FILM-C.md`. A row that already reads `No reply`
  was already correct before the beat, so the beat would only increment a digit.

  ---------------------------------------------------------------------------
  THE CUE PLUGS STRAIGHT INTO THE SHEET

  `01-HERO` section 12 removes the vertical Blotter engine, the central
  processor box and the cue-to-engine-to-sheet flow from the hero, and section
  9 forbids oversized arrowheads, animated particles, glowing tubes and a
  spiderweb of lines. Nothing sits between the cue and the sheet.

  Sections 7 and 9 give the device instead, and `hero-visual.tsx` draws it:

      one direct connector per cue, landing on that row's maintained block,
      closed by a small endpoint node.

  ONE FIXED SLOT. The cue card sits at x 1086, top level with the top of the
  sheet window, and every cue appears in that identical position. Cues do not
  accumulate: cue one arrives, its line draws, its row updates, and the whole
  cue and its line leave before cue two arrives.

  An earlier design stacked the cards down the right at their rows' heights.
  Priya and Daniel are adjacent rows 43.5px apart against a 50px card, so they
  overlap; the current static hero curves its connectors specifically to solve
  that collision. A fixed slot removes the problem instead of solving it, and
  it is what buys the straight line below.

  ONE RIGHT ANGLE. The line leaves the underside of the card, drops straight
  down at x 1109 — which is the centre of the card's source mark, so the
  vertical needs no routing — turns once to the left, and runs into the target
  row, closing on a round node at x 1006, the sheet's right edge. Only the
  length of the vertical drop changes between cues. Mitred corner, no curve, no
  second elbow, no arrowhead.

  THE THIRD CUE STAYS. After Daniel's row updates, his card, its line and its
  node remain and the film holds there. That is not an addition — render Film C
  at t=9.0 and the silence cue is still present with every row settled.

  ---------------------------------------------------------------------------
  WHERE THE GEOMETRY CAME FROM

  Every number below was measured off the LIVE rendering of `hero-visual.tsx`,
  not computed from its constants, because the eight columns are flex items
  that shrink by a pixel in total to fit a 1004px content box inside a 1006px
  window. The arithmetic and the rendering therefore disagree by fractions of a
  pixel, and the connectors and the sweep depend on the rendering.

    sheet window        1006 x 432.5      grid top      127
    row height          43.5              last row      42.5 (no bottom border)
    row centres         192.25  235.75  279.25  322.75  365.75
    row gutter          43                manual zone   372 (108+126+138)
    maintained zone     590 (132+156+112+56+134)
    ownership split     x 415.539         maintained block ends x 1005
    corridor            80                cue column    236, x 1086 to 1322
    cue card            236 x 50          source mark centre  x 1109
    node                x 1006, on the sheet's right edge

  The split's rendered x is 415.539 rather than the 415 the arithmetic gives.
  The sweep is driven from the measured value, so it starts under the 2px rule
  the header band already draws and never enters the manual zone.

  Alex Morgan's row centre is 365.75 rather than the 366.25 the row-centre
  formula gives, because the last row drops its bottom border. He carries no
  cue, so nothing depends on it.

  ---------------------------------------------------------------------------
  THE SWEEP, AND THE A/B

  When a cue lands, the changed cells fill with the Blotter yellow. Two rules
  survive from Film C verbatim:

    1. THE SWEEP NEVER CROSSES THE OWNERSHIP SPLIT. Running a Blotter fill
       across `Name` would say Blotter writes the name, which is the one thing
       the ownership split exists to deny.
    2. THE SWEEP LEAVES NOTHING BEHIND. Once it has passed, the row carries no
       badge, tint or marker. Blotter is claimed once and never by a mark on a
       row.

  The direction is Jon's to choose and both are built.

    ?sweep=in   (default)  the fill enters at the row's right edge, where the
                           line landed, runs right to left, and halts dead on
                           the ownership split.
    ?sweep=out             Film C's direction. The fill starts at the split and
                           runs left to right to the row's right edge.

  `in` is the default because this film's line arrives from the RIGHT. Film C's
  arrives from above, so its outward sweep does not contradict the arrival; here
  an outward sweep would run back against the direction the information came
  from, and the eye has to jump from the node to the far side of the sheet and
  travel back. `in` is one uninterrupted gesture — down, left, into the row,
  across — that arrests on the ownership rule. A fill that STOPS on a line reads
  as a boundary more strongly than one that starts there, and the boundary is
  the most important claim in this composition.

  The honest argument for `out` is recorded in `social/FILM-WEB-HERO.md`: it
  lands the cells in reading order. Press `s` to swap live.

  ---------------------------------------------------------------------------
  LINE WEIGHT

  Film C strokes 8px with an 18px node at 0.30 scale. The static hero strokes
  1.25px with an r2.75 node at 0.85. Both are right and the difference is
  entirely scale. This film renders at 0.8502, so Film C's numbers would be
  enormous and the hero's are too faint for something that draws itself.

  2.5px stroke, r5 node, both in `--blotter-500`, with the sweep's leading edge
  in `--blotter-700`. Tuned at the rendered 1124px width; the reasoning is in
  `social/FILM-WEB-HERO.md`.

  ---------------------------------------------------------------------------
  CLAIM SAFETY

  No price, no availability, no beta, no launch date, no cohort language. No
  outreach is written or drafted: every `Next move` on screen is a prompt to the
  user and no drafted message appears. Nothing depicts a sweep across an inbox.
  No credential field appears at any size in any frame. No bank logo appears.

  ---------------------------------------------------------------------------
  CONTROLS, not part of the film

    space  play / pause        c  hide the controls, for recording
    arrows step one frame      f  true 1322px size instead of fit-to-window
    r      restart             s  swap the sweep direction

/* ------------------------------------------------------------------ tokens */
/* Sampled from web/app/globals.css. Retune there, not here. */
:root{
  --ink:#14181f; --ink-muted:#5f6368; --ink-faint:#a4a8ac;
  --blotter-100:#f7f2e8; --blotter-200:#f3e6c6;
  --blotter-400:#d9b64a; --blotter-500:#c9a227; --blotter-700:#8a6d12;
  --manual-100:#edf2f8; --manual-row:#ffffff;
  --sheet-border:#dadce0; --sheet-grid:#e8eaed;
  --sheet-header:#f8f9fa; --sheet-chrome:#ffffff; --sheet-green:#0f9d58;
  --chip-replied-bg:#d7e7fb;   --chip-replied-fg:#1a56a8;
  --chip-scheduled-bg:#e5ddf7; --chip-scheduled-fg:#5b3fa8;
  --chip-completed-bg:#d7f0dd; --chip-completed-fg:#1e6b34;
  --chip-noreply-bg:#fbeacb;   --chip-noreply-fg:#8a5a00;
  --chip-sent-bg:#e8eaed;      --chip-sent-fg:#5f6368;

  --sans:"Geist","Geist Fallback",ui-sans-serif,system-ui,sans-serif;
  --sheet-type:Arial,Helvetica,sans-serif;
}

/* -------------------------------------------------------------------- shell */
/*
  `line-height:1.5` is load-bearing, not a default. Tailwind's preflight sets it
  on `html`, and every unprefixed size in `sheet-window.tsx` and `sheet-grid.tsx`
  inherits it. It is what makes the grid rows come out at 43.5px and the chrome
  stack come out at 127px without a single height being declared anywhere.
*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0d1117;color:#c9d1d9;font-family:var(--sans);line-height:1.5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:20px;overflow:hidden;-webkit-font-smoothing:antialiased;
}

/*
  BARE IS TRANSPARENT, and that is the difference from Film C.

  Film C is the mobile hero, inset in a rounded card with its own ring, so it
  paints its own ground. This film replaces `HeroVisualModule`, which is a
  transparent object sitting directly on the page's `.field-open` gradient. A
  ground of its own would put a second field inside the page's field and make
  the iframe's edges visible. Transparent means the film is indistinguishable
  from the static composition it replaces.
*/
body.bare{background:transparent;gap:0;padding:0;display:block;overflow:visible}
body.bare .chrome{display:none}
body.bare .stagehold{margin:0}

.stagehold{flex:none;overflow:hidden}
.stagewrap{width:1322px;height:432.5px;transform-origin:top left}

/*
  THE CANVAS IS EXACTLY 1322 x 432.5, which is `TOTAL_W` by `SHEET_H`.

  The stage does NOT clip. The sheet's ratified drop shadow, `0 8px 28px -8px`,
  extends about 14px below the sheet's own box, and the sheet is the full height
  of the canvas — so in the real page that shadow paints outside this box, onto
  `.field-open`. Clipping it here would put the sheet on a hard edge. The film
  paints it and lets the host decide; see `social/FILM-WEB-HERO.md` for the
  bleed the iframe wants if the shadow is to survive intact.
*/
.stage{position:relative;width:1322px;height:432.5px;overflow:visible}

/*
  Standalone viewing only, and off in bare mode. This is NOT `.field-open`: the
  page's two radial glows are anchored to the whole hero wrapper rather than to
  this 432.5px slice, so reproducing them here would be wrong. It is a neutral
  approximation of the ground the composition sits on, so the file is legible
  when opened on its own.
*/
.field{position:absolute;left:-60px;right:-60px;top:-90px;bottom:-90px;
  background:linear-gradient(180deg,#f8fafd 0%,#f2f6fb 100%);z-index:0}
body.bare .field{display:none}

/* ========================================================== the cue slot === */
/*
  ONE FIXED SLOT. `activity-cue.tsx`, reproduced to the pixel: 236px wide,
  8px radius, `px-3 py-2`, a 13px/17px semibold primary line over an 11.5px/15px
  timestamp, and the ratified two-layer shadow. It measures 236 x 50 on the live
  page and it measures 236 x 50 here.

  Top at y 0, level with the top of the sheet window, per the brief. The 20px
  mark column is fixed width so the connector's x cannot move between a 20px
  Gmail mark and a 19px Calendar one.
*/
.card{position:absolute;left:1086px;top:0;width:236px;z-index:6;
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border:1px solid var(--sheet-border);border-radius:8px;
  background:var(--sheet-chrome);
  box-shadow:0 1px 2px rgba(60,64,67,.12),0 4px 12px -6px rgba(60,64,67,.22);
  opacity:0;will-change:opacity,transform}
.cmark{width:20px;flex:none;display:flex;align-items:center;justify-content:center}
.cmark svg{display:block}
/*
  The muted Gmail mark, drawn exactly as `section-3/day-timeline.tsx` draws it:
  opacity 40%, grayscale. The thread is a Gmail thread so the slot names it, and
  the muting carries the fact that nothing arrived in it. A full-strength mark
  would imply Gmail signalled something, and Gmail signalling nothing is the
  entire point of that row. Not struck, not absent.

  This is the opposite of `HERO_CUES`, deliberately: the static hero keeps
  Daniel at full strength because muting there depends on Section 3's
  `NO NEW ACTIVITY` stamp to be legible. This film carries that stamp, so the
  Section 3 treatment is the correct one here.
*/
.cmark.muted{opacity:.40;filter:grayscale(1)}
.ctext{min-width:0}
.cprimary{display:block;font-size:13px;line-height:17px;font-weight:600;
  color:var(--ink);white-space:nowrap}
.cstamp{display:block;font-size:11.5px;line-height:15px;
  color:var(--ink-muted);white-space:nowrap}

/* ======================================================== the connector ==== */
/*
  One L per cue: down the corridor from the card's source mark, one right angle,
  into the row, closed by a round node on the sheet's right edge. `overflow:
  visible` so the node is never clipped by the svg box.

  `--blotter-500` rather than the static hero's `--blotter-400`, and the same
  step Film C took for the same reason: `-400` is tuned to be a hairline the eye
  finds only when it looks for it, which is right for a still and wrong for a
  line that has to be watched arriving.
*/
.wires{position:absolute;left:0;top:0;z-index:5;overflow:visible;
  pointer-events:none}
.wire{fill:none;stroke:var(--blotter-500);stroke-width:2.5;
  stroke-linejoin:miter;stroke-linecap:butt}
.wnode{fill:var(--blotter-500)}

/* ============================================================= the sheet == */
/*
  `sheet-window.tsx` and `sheet-grid.tsx`, reproduced. Arial rather than the
  page font, exactly as `.sheet-type` pins it: `hero-reference-v1.png` is set in
  Arial, so pinning it keeps the primitive faithful and insulated from page-theme
  changes.
*/
/*
  `font-size:16px` is the page's base, which is what `SheetWindow` inherits —
  it declares no size of its own and only `SheetGrid` sets `text-[15px]`. That
  distinction is worth a quarter of a pixel and it is not academic: the star
  beside the document title carries no size class either, so its line box is
  16 x 1.5 = 24 rather than the title's 19 x 1.25 = 23.75, and the star is the
  taller of the two. Scoping 19px to the container instead of to the title text
  makes the whole sheet 432.25 tall and puts every row centre a quarter pixel
  above where `hero-visual.tsx` asserts its connector endpoints.
*/
.sheet{position:absolute;left:0;top:0;width:1006px;z-index:2;
  font-family:var(--sheet-type);color:var(--ink);font-size:16px;
  background:var(--sheet-chrome);border:1px solid var(--sheet-border);
  border-radius:12px;overflow:hidden;
  box-shadow:0 1px 3px rgba(60,64,67,.15),0 8px 28px -8px rgba(60,64,67,.25)}

.titlebar{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.gicon{width:32px;height:32px;flex:none;border-radius:6px;
  background:var(--sheet-green);display:grid;place-items:center}
.tmeta{flex:1;min-width:0}
.tname{display:flex;align-items:center;gap:8px}
.tname .ttl{font-size:19px;line-height:1.25}
.tname .star{color:var(--ink-faint)}
.menus{margin-top:2px;display:flex;gap:12px;font-size:13px;color:var(--ink-muted)}
.saved{flex:none;font-size:13px;color:var(--ink-muted)}
.share{flex:none;border-radius:999px;background:var(--chip-replied-bg);
  color:var(--chip-replied-fg);font-size:14px;padding:6px 16px}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:#5f6b7a;
  color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center}

.fbar{margin-top:8px;display:flex;align-items:stretch;font-size:13px;
  border-top:1px solid var(--sheet-grid);border-bottom:1px solid var(--sheet-grid)}
.fcell{width:100px;flex:none;border-right:1px solid var(--sheet-grid);
  padding:6px 12px;display:flex;align-items:center;justify-content:space-between}
.fcell .caret{color:var(--ink-faint)}
.fval{flex:1;padding:6px 12px;display:flex;align-items:center;gap:8px;position:relative}
.fval .fx{font-style:italic;color:var(--ink-faint)}
/*
  The formula bar tracks the cell it points at.

  `hero-visual.tsx` selects D2 with the bar reading `Replied`, which is Sarah
  Chen's Status cell — the exact cell the first beat moves. Holding it static
  would put `Replied` on screen for 2.4 seconds while the cell itself still
  reads `Sent`: a frame that contradicts itself. So the bar flips on the same
  instant the chip does, and the held final frame carries D2 / `Replied`,
  identical to the ratified static hero it replaces.

  Film C froze its bar at A2 / `Sarah Chen` instead, for two reasons that do not
  apply here: a manual field cannot contradict a frame it is not part of, and it
  is one fewer thing animating at the loop seam. This film has no seam, and at
  1124px the bar is legible rather than shape-only. Reverting to A2 is two
  values in `SHEET` below.
*/
.fstack{position:relative;display:inline-block;min-width:70px;height:19.5px}
.fstack .va,.fstack .vb{position:absolute;left:0;top:0;white-space:nowrap;
  will-change:opacity,transform}

.letters{display:flex;background:var(--sheet-header);
  border-bottom:1px solid var(--sheet-grid);font-size:12px;color:var(--ink-muted)}
.letters .gut{width:43px;flex:none;border-right:1px solid var(--sheet-grid)}
.letters .col{border-right:1px solid var(--sheet-grid);text-align:center;padding:4px 0}
.letters .col:last-child{border-right:0}

.tabs{display:flex;align-items:center;gap:4px;padding:8px 12px;
  border-top:1px solid var(--sheet-grid);font-size:13px}
.tabs .sym{padding:0 6px;color:var(--ink-muted)}
.tab{border-radius:4px;padding:4px 12px;color:var(--ink-muted);white-space:nowrap}
.tab.on{background:var(--chip-replied-bg);color:var(--chip-replied-fg);font-weight:500}
.tab .tcaret{margin-left:4px;opacity:.6}

/* the grid ---------------------------------------------------------------- */
/*
  The columns are flex items that DO shrink. Their nominal widths sum to 1005
  against a 1004px content box, so the browser takes a pixel back across the
  eight of them and every column boundary lands on a fraction. That is what the
  live page renders, and reproducing the rendering rather than the arithmetic is
  what keeps the split, the sweep and the connectors on the same geometry the
  page has already been approved at.
*/
.grid{position:relative;font-size:15px}
.row{display:flex;border-bottom:1px solid var(--sheet-grid);position:relative}
.row:last-child{border-bottom:0}
.gut{width:43px;flex:none;border-right:1px solid var(--sheet-grid);
  background:var(--sheet-header);padding:10px 0;text-align:center;
  font-size:12px;color:var(--ink-muted)}
.cell{padding:10px 12px;white-space:nowrap;overflow:hidden;position:relative;
  background:var(--manual-row)}
/*
  HEADER CELLS DO NOT CLIP, and that is `sheet-grid.tsx`'s behaviour rather than
  an oversight here. `overflow-hidden` is on the data cells alone. It matters
  for exactly one cell: `Days` is a 56px column carrying a 15px semibold header
  against 24px of padding, so the word is wider than its box and overflows —
  leftward, because the column is right-aligned, into `Last contact`'s padding,
  where there is room. Clipping it instead eats the `D`.
*/
.hrow .cell{overflow:visible}
.cell.chipcell{padding:10px 8px}
.cell.num{text-align:right}
.cell.ital{font-style:italic;color:var(--ink-muted)}
/* The ratified zone boundary: Name, Title and Firm are yours; the five columns
   to the right of this rule are the ones Blotter keeps current. */
.cell.split{border-left:2px solid var(--sheet-border)}
.hrow .cell{font-weight:600}
.hrow .manual{background:var(--manual-100)}
/* 01-HERO section 8 as amended by Jon on August 5, 2026: the header band alone
   carries the maintained zone. Data rows stay plain white. */
.hrow .kept{background:var(--blotter-100)}
.dash{display:block;text-align:center;color:var(--ink-faint)}

.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;
  padding:3px 7px;font-size:12.5px;line-height:1;white-space:nowrap;
  vertical-align:middle}
.chip svg{flex:none;opacity:.6}
.chip[data-s="Replied"]{background:var(--chip-replied-bg);color:var(--chip-replied-fg)}
.chip[data-s="Call scheduled"]{background:var(--chip-scheduled-bg);color:var(--chip-scheduled-fg)}
.chip[data-s="Call completed"]{background:var(--chip-completed-bg);color:var(--chip-completed-fg)}
.chip[data-s="No reply"]{background:var(--chip-noreply-bg);color:var(--chip-noreply-fg)}
.chip[data-s="Sent"]{background:var(--chip-sent-bg);color:var(--chip-sent-fg)}

/*
  A cell that changes holds both values stacked and REPLACES one with the other,
  so the column geometry cannot shift on the frame the value lands. The two never
  overlap: Film C's first build let them cross-fade and "Attend coffee chat"
  sitting on top of "Send thank-you" is a smear rather than a transition.
*/
.stack{position:relative;display:block;height:22.5px}
.va,.vb{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;
  height:22.5px;will-change:opacity,transform}
.cell.num .va,.cell.num .vb{justify-content:flex-end}

/*
  THE SWEEP. The moment arriving along the row it changes. Transient, and it is
  not a badge — nothing is left behind on the row once it has passed.

  It spans the maintained block only, from the ownership split to the sheet's
  right edge, and `left` and `width` are written from the measured column
  geometry in the script rather than typed here, so a width change cannot
  silently move it into the manual zone.

  The leading edge is `--blotter-700` rather than `-500`: the wash is a 17% tint
  and the edge is the part that has to read as a moving object, so wash and edge
  are the same family two steps apart. `--blotter-100` is what the maintained
  header band above it is already painted in, for the same reason.
*/
.sweepwrap{position:absolute;top:0;bottom:0;overflow:hidden;pointer-events:none}
/*
  The wipe bar. A pale band that travels up through the grid at the end of the
  cycle and hands each row back to its opening state as it passes.

  Film C's device, ported. It is deliberately not the Blotter yellow: the yellow
  means "Blotter maintains this", and this bar is the film resetting itself
  rather than anything the product does. A soft neutral says housekeeping.
*/
.wipe{
  position:absolute; left:0; right:0; top:0; height:120px;
  pointer-events:none; opacity:0; will-change:transform,opacity;
  background:linear-gradient(to top,
    rgba(255,255,255,0) 0%,
    rgba(238,242,248,0.92) 38%,
    rgba(238,242,248,0.92) 62%,
    rgba(255,255,255,0) 100%);
}
#grid{ position:relative; }
.rowsweep{position:absolute;top:0;bottom:0;width:0;
  background:rgba(201,162,39,.17);will-change:width,opacity}
.rowsweep .lead{position:absolute;top:0;bottom:0;width:3px;
  background:var(--blotter-700)}

/* ------------------------------------------------------------- controls */
.chrome{display:flex;align-items:center;gap:12px;font-size:13px;flex:none}
.chrome button{font:inherit;background:#21262d;color:#c9d1d9;border:1px solid #30363d;
  border-radius:7px;padding:7px 12px;cursor:pointer}
.chrome button:hover{background:#30363d}
.chrome input[type=range]{width:380px;accent-color:#d9b64a}
.chrome .t{font-family:ui-monospace,monospace;color:#8b949e;min-width:112px}
.chrome .hint{color:#6e7681}
</style>
</head>

<body>
<div class="stagehold" id="stagehold">
<div class="stagewrap" id="stagewrap">
<div class="stage" id="stage">
  <div class="field"></div>

  <!-- One shared clip path for the Calendar mark. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><clipPath id="calr"><rect width="20" height="20" rx="2.4"/></clipPath></defs>
  </svg>

  <!-- ============================================================ sheet -->
  <div class="sheet" id="sheet">
    <div class="titlebar">
      <span class="gicon">
        <svg width="15" height="19" viewBox="0 0 15 19" fill="none" aria-hidden="true">
          <path d="M9 0H1.5A1.5 1.5 0 0 0 0 1.5v16A1.5 1.5 0 0 0 1.5 19h12a1.5 1.5 0 0 0 1.5-1.5V6L9 0Z" fill="#fff" fill-opacity=".25"/>
          <path d="M3.5 8.5h8v6h-8v-6Zm1 1.5v1h2.5v-1H4.5Zm3.5 0v1h2.5v-1H8Zm-3.5 2v1h2.5v-1H4.5Zm3.5 0v1h2.5v-1H8Z" fill="#fff"/>
        </svg>
      </span>
      <div class="tmeta">
        <div class="tname"><span class="ttl">IB Recruiting Tracker</span><span class="star">&#9734;</span></div>
        <div class="menus"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span><span>Tools</span><span>Extensions</span><span>Help</span></div>
      </div>
      <span class="saved">All changes saved in Drive</span>
      <span class="share">Share</span>
      <span class="avatar">JN</span>
    </div>

    <div class="fbar">
      <div class="fcell"><span id="fcellref">D2</span><span class="caret">&#9662;</span></div>
      <div class="fval"><span class="fx">fx</span><span class="fstack" id="fstack"></span></div>
    </div>

    <div class="letters" id="letters"></div>
    <div class="grid" id="grid"></div>

    <div class="tabs">
      <span class="sym">+</span><span class="sym">&#9776;</span>
      <span class="tab">Contacts</span>
      <span class="tab on">Blotter<span class="tcaret">&#9662;</span></span>
    </div>
  </div>

  <!-- ======================================================== connector -->
  <svg class="wires" id="wires" width="1322" height="432.5"
       viewBox="0 0 1322 432.5" aria-hidden="true"></svg>

  <!-- ========================================================= cue slot -->
  <div id="cards"></div>
</div>
</div>
</div>

<div class="chrome">
  <button id="play">Pause</button>
  <input type="range" id="scrub" min="0" max="11500" value="0" step="1">
  <span class="t" id="clock">0.00 / 11.50</span>
  <button id="btnG">Gmail</button>
  <button id="btnC">Calendar</button>
  <button id="btnS">Silence</button>
  <button id="btnH">Hold</button>
  <button id="btnSweep">Sweep: in</button>
  <button id="btnFit">True size</button>
  <span class="hint">space play &middot; arrows step &middot; s swap sweep &middot; c clean &middot; f true size &middot; r restart</span>
</div>

<script>
"use strict";

/* =========================================================================
   CANONICAL DATA. Nothing here may be edited without a ruling.

   The `to` values are the ratified end state and are `HERO_ROWS` in
   `web/lib/sheet-data.ts` exactly, so the film converges on the hero sheet
   rather than on something adjacent — which is what makes it structurally
   unable to contradict the page it becomes the hero of.

   The opening values are Jon's, from the brief: Sarah at Sent / blank /
   1/13/26 / 3, Priya at Call scheduled / Attend coffee chat / 1/15/26 / 1 /
   1/16 @ 11:00 AM, Daniel at Sent / blank / 1/11/26 / 4.

   MARCUS LEE AND ALEX MORGAN NEVER MOVE. They are their ratified rows at every
   frame and they are there so the sheet reads as a tracker rather than as a
   three-row demonstration. Marcus holds a FUTURE scheduled call throughout,
   which is deliberate: it shows the tracker carrying forward-looking state.
   Two rows reading `Call scheduled` at the open is correct and intended — one
   of them resolves during the film and the other does not.

   Alex Morgan's `Next move` em dash is the single ratified exception to the
   genuinely-blank rule, scoped to that one cell, reinstated by Jon on
   August 5, 2026 and implemented as `{ dash: true }` in `sheet-grid.tsx`.
   ========================================================================= */

const COLS = [
  { key:"name",   head:"Name",         w:120, kept:false },
  { key:"title",  head:"Title",        w:114, kept:false, ital:true },
  { key:"firm",   head:"Firm",         w:138, kept:false },
  { key:"status", head:"Status",       w:132, kept:true, chip:true },
  { key:"next",   head:"Next move",    w:156, kept:true },
  { key:"last",   head:"Last contact", w:112, kept:true },
  { key:"days",   head:"Days",         w:56,  kept:true, num:true },
  { key:"call",   head:"Call",         w:134, kept:true },
];
const LETTERS = ["A","B","C","D","E","F","G","H"];
const SPLIT_I = COLS.findIndex(c => c.kept);   /* 3 */

const ROWS = [
  { name:"Jamie Diamond", title:"Associate", firm:"JPMorgan",
    status:"Sent", next:"", last:"1/13/26", days:"3", call:"",
    to:{ status:"Replied", next:"Reply to Jamie", last:"1/16/26", days:"0" } },

  { name:"David Salmon", title:"Analyst", firm:"Goldman Sachs",
    status:"Call scheduled", next:"Attend coffee chat", last:"1/15/26",
    days:"1", call:"1/17 @ 2:00 PM" },

  { name:"Ken Molise", title:"Vice President", firm:"Moelis & Co",
    status:"Call scheduled", next:"Attend coffee chat", last:"1/15/26",
    days:"1", call:"1/16 @ 11:00 AM",
    to:{ status:"Call completed", next:"Send thank-you", last:"1/16/26",
         days:"0", call:"Completed 1/16" } },

  /*
     THE FROZEN CELL. `to` deliberately carries no `last`, so Daniel's
     `Last contact` cell is built as plain static text and there is no second
     value in it for any code path to reach. It reads 1/11/26 on every frame of
     the film, including while `Days` climbs from 4 to 5 in the column beside
     it. A cell visibly not changing is the evidence that nothing arrived.

     Daniel opens at Days 4 against a last contact of 1/11/26 while the other
     rows are consistent with a current date of 1/16/26. That one-day looseness
     is inherited from Film C and deliberately kept: it is what lets Days
     visibly climb while Last contact stays frozen. Do not reconcile it.
  */
  { name:"Larry Sync", title:"Associate", firm:"BlackRock",
    status:"Sent", next:"", last:"1/11/26", days:"4", call:"",
    to:{ status:"No reply", next:"Bump thread", days:"5" } },

  { name:"Jerome Bowel", title:"Analyst", firm:"Carlyle",
    status:"Sent", next:{dash:true}, last:"1/16/26", days:"0", call:"" },
];

/*
  The three cues, in this order, each in the one fixed slot.

  Beat 2 IS PRIYA, and that is an override rather than a mistake. `HERO_CUES` in
  `sheet-data.ts` currently reads `Coffee chat with Marcus Lee` targeting row 1;
  Jon ruled on August 11, 2026 that this film agrees with Film C, whose calendar
  beat is Priya, and that the page data will be updated to match this film
  afterwards.

  Its stamp is `Jan 16 - 11:00 AM`, given explicitly in the brief. That is a
  third value for this moment — `SECTION_3_MOMENTS` says 2:00 PM and `HERO_CUES`
  says Jan 17 - 2:00 PM for Marcus — and it is the only one of the three that is
  internally consistent, because Priya's opening `Call` cell reads
  `1/16 @ 11:00 AM` and a 2:00 PM stamp would contradict it inside one frame.
*/
const CUES = [
  { id:"sarah",  row:0, source:"gmail",
    primary:"Jamie Diamond replied",          stamp:"Jan 16 · 10:42 AM" },
  { id:"priya",  row:2, source:"calendar",
    primary:"Coffee chat with Ken Molise", stamp:"Jan 16 · 11:00 AM" },
  { id:"daniel", row:3, source:"muted",
    primary:"No reply for 5 days",         stamp:"Day 5 · No new activity" },
];

/* The selected cell and its two formula-bar values. D2 is Sarah Chen's Status
   cell, which is what the first beat moves. Set both to the same string, and
   `fcellref` to A2, to freeze the bar the way Film C does. */
const SHEET = { ref:"D2", formulaFrom:"Sent", formulaTo:"Replied" };

/* =========================================================================
   MARKS, verbatim from web/components/google-marks.tsx
   ========================================================================= */

const GMAIL_SVG = '<svg width="20" height="15" viewBox="0 0 24 18" aria-hidden="true">'
  + '<path d="M1.64 18h3.27V9.95L0 6.27v10.09C0 17.27.73 18 1.64 18Z" fill="#4285F4"/>'
  + '<path d="M19.09 18h3.27c.9 0 1.64-.73 1.64-1.64V6.27l-4.91 3.68V18Z" fill="#34A853"/>'
  + '<path d="M19.09 1.64v8.31L24 6.27V2.45c0-1.52-1.73-2.38-2.95-1.47l-1.96 1.47Z" fill="#FBBC04"/>'
  + '<path d="M4.91 9.95V1.64L12 6.95l7.09-5.31v8.31L12 15.27 4.91 9.95Z" fill="#EA4335"/>'
  + '<path d="M0 2.45v3.82l4.91 3.68V1.64L2.95.98C1.73.07 0 .93 0 2.45Z" fill="#C5221F"/></svg>';

const CAL_SVG = '<svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">'
  + '<g clip-path="url(#calr)">'
  + '<rect width="20" height="20" fill="#4285F4"/>'
  + '<rect x="15.6" width="4.4" height="4.4" fill="#1967D2"/>'
  + '<rect x="15.6" y="4.4" width="4.4" height="11.2" fill="#FBBC04"/>'
  + '<rect y="15.6" width="4.4" height="4.4" fill="#188038"/>'
  + '<rect x="4.4" y="15.6" width="11.2" height="4.4" fill="#34A853"/>'
  + '<rect x="15.6" y="15.6" width="4.4" height="4.4" fill="#EA4335"/>'
  + '<rect x="4.4" y="4.4" width="11.2" height="11.2" fill="#ffffff"/>'
  + '<text x="10" y="13.6" text-anchor="middle" font-size="9.4" font-weight="500"'
  + ' fill="#4285F4" font-family="Arial, Helvetica, sans-serif">31</text>'
  + '</g></svg>';

const CARET = '<svg width="7" height="4.5" viewBox="0 0 8 5"><path d="M0 0h8L4 5z" fill="currentColor"/></svg>';

/* =========================================================================
   BUILD
   ========================================================================= */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

/* `?sweep=out` picks Film C's direction. Anything else, including nothing, is
   `in`. See the header comment for why `in` is the default. */
let sweepMode = params.get("sweep") === "out" ? "out" : "in";

(function letters(){
  $("letters").innerHTML = '<div class="gut"></div>' + COLS.map((c,i) =>
    `<div class="col" style="width:${c.w}px">${LETTERS[i]}</div>`).join("");
})();

function valueHTML(col, v){
  if (v === "" || v === null || v === undefined) return "";
  if (v && v.dash) return '<span class="dash">—</span>';
  if (col.chip) return `<span class="chip" data-s="${v}">${v}${CARET}</span>`;
  return v;
}

const flips  = [];      /* flips[r][key] = {va, vb, cell} for every moving cell */
const rowEls = [];
const rowSweeps = [];
const sweepWraps = [];

(function grid(){
  const el = $("grid");

  const h = document.createElement("div");
  h.className = "row hrow";
  h.innerHTML = '<div class="gut">1</div>' + COLS.map((c,i) => {
    const cls = ["cell", c.kept ? "kept" : "manual", i===SPLIT_I ? "split" : "",
                 c.num ? "num" : "", c.chip ? "chipcell" : ""].join(" ");
    return `<div class="${cls}" style="width:${c.w}px">${c.head}</div>`;
  }).join("");
  el.appendChild(h);

  ROWS.forEach((r, ri) => {
    const row = document.createElement("div");
    row.className = "row";
    const f = {};
    row.innerHTML = '<div class="gut">' + (ri+2) + '</div>' + COLS.map((c,i) => {
      const cls = ["cell", i===SPLIT_I ? "split" : "", c.num ? "num" : "",
                   c.chip ? "chipcell" : "", c.ital ? "ital" : ""].join(" ");
      /* A cell only becomes a stack if this row's `to` names it. Daniel's
         `last` is absent from his `to`, so it is built as static text. */
      const moves = r.to && r.to[c.key] !== undefined;
      const inner = moves
        ? `<span class="stack" data-k="${c.key}">`
            + `<span class="va">${valueHTML(c, r[c.key])}</span>`
            + `<span class="vb">${valueHTML(c, r.to[c.key])}</span>`
          + `</span>`
        : valueHTML(c, r[c.key]);
      return `<div class="${cls}" style="width:${c.w}px">${inner}</div>`;
    }).join("")
      + '<div class="sweepwrap"><div class="rowsweep"><span class="lead"></span></div></div>';
    el.appendChild(row);

    [...row.querySelectorAll(".stack")].forEach(s => {
      f[s.dataset.k] = { va:s.querySelector(".va"), vb:s.querySelector(".vb"),
                         cell:s.parentElement };
    });
    flips.push(f);
    rowEls.push(row);
    rowSweeps.push(row.querySelector(".rowsweep"));
    sweepWraps.push(row.querySelector(".sweepwrap"));
  });
})();

(function formulaBar(){
  $("fcellref").textContent = SHEET.ref;
  $("fstack").innerHTML = `<span class="va">${SHEET.formulaFrom}</span>`
                        + `<span class="vb">${SHEET.formulaTo}</span>`;
})();
const fbar = { va:$("fstack").querySelector(".va"), vb:$("fstack").querySelector(".vb") };

(function cards(){
  $("cards").innerHTML = CUES.map(c => {
    const mark = c.source === "calendar" ? CAL_SVG : GMAIL_SVG;
    const cls  = c.source === "muted" ? "cmark muted" : "cmark";
    return `<div class="card" id="card-${c.id}">`
      + `<span class="${cls}">${mark}</span>`
      + `<span class="ctext">`
      +   `<span class="cprimary">${c.primary}</span>`
      +   `<span class="cstamp">${c.stamp}</span>`
      + `</span></div>`;
  }).join("");
})();
const cardEls = CUES.map(c => $("card-" + c.id));

/* =========================================================================
   MEASURED GEOMETRY

   Read off the built DOM rather than typed, for the reason the header comment
   gives: the eight columns shrink by a pixel in total to fit the sheet's
   content box, so every boundary lands on a fraction and the arithmetic in the
   build spec is half a pixel out. The connectors and the sweep are driven from
   what is actually painted.
   ========================================================================= */

/*
  Two coordinate spaces, and conflating them is a one-pixel bug.

  The connector lives in the svg, which spans the STAGE. The sweep lives inside
  a row, whose origin is a pixel to the right of the stage's because the sheet
  has a 1px border. Measuring the split against the stage and then writing it as
  the sweep's `left` puts the wash a pixel clear of the very rule it is supposed
  to begin on. So `pxIn` takes the element to measure against.

  Both divide out whatever scale the stage is currently under, so a measurement
  is a canvas measurement whether or not `fit()` has run yet.
*/
const STAGE_K = (() => { const b = $("stage").getBoundingClientRect();
                         return b.width / 1322 || 1; })();
const pxIn = (el, origin) => {
  const o = origin.getBoundingClientRect(), b = el.getBoundingClientRect();
  return { x:(b.left-o.left)/STAGE_K, y:(b.top-o.top)/STAGE_K,
           w:b.width/STAGE_K, h:b.height/STAGE_K };
};
const px = el => pxIn(el, $("stage"));

/* Row centres, in canvas coordinates — what the connector endpoints need. */
const ROW_MID = rowEls.map(el => { const b = px(el); return b.y + b.h / 2; });

/* The ownership split and the right edge of the maintained block, measured off
   the header row's own cells so the sweep can never drift from the rule, and in
   GRID coordinates because that is the space the sweep is positioned in. */
const hdrRow   = $("grid").firstElementChild;
const hdrCells = [...hdrRow.querySelectorAll(".cell")];
const SPLIT_X  = pxIn(hdrCells[SPLIT_I], hdrRow).x;
const KEPT_END = (() => { const b = pxIn(hdrCells[COLS.length-1], hdrRow);
                          return b.x + b.w; })();
const SWEEP_W  = KEPT_END - SPLIT_X;

/* The same two edges in canvas coordinates, for the record and for the
   verification pass. The sweep must never go left of `SPLIT_CANVAS`. */
const SPLIT_CANVAS = px(hdrCells[SPLIT_I]).x;

/* Where each maintained column's content sits inside the sweep, as an x offset
   from the split. A value flips when the leading edge is 35% into its own
   column, or 52% into `Days`, which is right-aligned and so has its content at
   the far end. Same anchor in both sweep directions; only the progress that
   reaches it is measured from the other side. */
const FLIP_X = {};
COLS.forEach(c => {
  if (!c.kept) return;
  const b = pxIn(hdrCells[COLS.indexOf(c)], hdrRow);
  FLIP_X[c.key] = (b.x - SPLIT_X) + b.w * (c.num ? 0.52 : 0.35);
});

/* The connector. One L per cue: down the corridor at the centre of the card's
   source mark, one right angle, into the row, closed on the sheet's edge. */
const CARD_BOTTOM = px(cardEls[0]).y + px(cardEls[0]).h;      /* 50 */
const STEM_X      = (() => { const b = px(cardEls[0].firstElementChild);
                             return b.x + b.w / 2; })();       /* 1109 */
const SHEET_EDGE  = (() => { const b = px($("sheet")); return b.x + b.w; })(); /* 1006 */

const NODE_R = 5;

const wires = CUES.map(c => {
  const ry = ROW_MID[c.row];
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("class", "wire");
  p.setAttribute("d", `M ${STEM_X} ${CARD_BOTTOM} L ${STEM_X} ${ry} L ${SHEET_EDGE} ${ry}`);
  const n = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  n.setAttribute("class", "wnode");
  n.setAttribute("cx", SHEET_EDGE); n.setAttribute("cy", ry); n.setAttribute("r", NODE_R);
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.appendChild(p); g.appendChild(n);
  $("wires").appendChild(g);
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  return { g, path:p, node:n, len };
});

/* Everything the composition was actually laid out at, in canvas coordinates,
   so a verification pass reads the film's own measurements rather than
   re-deriving them and agreeing with itself. */
window.GEOMETRY = {
  splitCanvasX: SPLIT_CANVAS, splitGridX: SPLIT_X,
  keptEndGridX: KEPT_END, sweepW: SWEEP_W,
  rowMid: ROW_MID, cardBottom: CARD_BOTTOM, stemX: STEM_X,
  sheetEdge: SHEET_EDGE, nodeR: NODE_R, flipX: FLIP_X, dur: 11.50,
};

/* The sweep spans the maintained block exactly, and which end it grows from is
   the A/B. Applied on mode change rather than per frame. */
function applySweepMode(){
  sweepWraps.forEach(w => { w.style.left = SPLIT_X + "px"; w.style.width = SWEEP_W + "px"; });
  rowSweeps.forEach(s => {
    const lead = s.querySelector(".lead");
    if (sweepMode === "out") { s.style.left = "0px";  s.style.right = "auto";
                               lead.style.right = "0px"; lead.style.left = "auto"; }
    else                     { s.style.left = "auto"; s.style.right = "0px";
                               lead.style.left = "0px";  lead.style.right = "auto"; }
  });
  const b = $("btnSweep"); if (b) b.textContent = "Sweep: " + sweepMode;
}
applySweepMode();

/* =========================================================================
   TIMELINE. Every visible property is a pure function of t, so scrubbing back
   is identical to playing forward and `?t=` is reproducible.
   ========================================================================= */

const DUR = 13.00;

/*
  THE WIPE, added August 11, 2026.

  The film used to play once and stop, and the embed cross-faded to the static
  hero. Jon rejected that outright: *"It's either it's the film, and it goes to
  the static permanently, or it's the film, and it indefinitely loops. And I'm
  in favor of it indefinitely looping like we do on mobile."*

  So this is Film C's device, ported rather than reinvented — `FILM-C.md` calls
  it a pale sweep that runs back across the grid and returns the three rows to
  their opening state. Here it travels up through the grid, and each row is
  handed back **whole** at the instant the bar's centre reaches it, which is
  what keeps a row from ever being half of one state and half of the other.

  Both ends of the cycle are exactly zero, so the seam is frame-identical
  rather than nearly so.

    9.84 - 11.50  STILL    nothing on the canvas changes. The beat.
   11.50 - 12.20  WIPE     the bar travels up; rows hand back as it passes.
   12.20 - 13.00  AT REST  identical to 0.00 - 1.20.
*/
const WIPE = [11.50, 12.20];

/** Height of the wipe bar, and how sharply a row hands back behind it. */
const WIPE_H = 120;
const WIPE_RAMP = 0.14;

/*
  The wipe bar and the geometry that drives it.

  Measured from the built grid rather than assumed, so a row-height change
  cannot desynchronise a row's revert from the bar that is supposed to cause it.
  `GRID_H + WIPE_H` is the full travel: the bar starts entirely below the grid
  and finishes entirely above it, so every row is crossed exactly once.
*/
const wipeEl = document.createElement("div");
wipeEl.className = "wipe";
$("grid").appendChild(wipeEl);

const GRID_H = $("grid").offsetHeight;
const WIPE_TRAVEL = GRID_H + WIPE_H;
const ROW_MID_LOCAL = rowEls.map(el => el.offsetTop + el.offsetHeight / 2);
const wipeAt = r => (GRID_H + WIPE_H / 2 - ROW_MID_LOCAL[r]) / WIPE_TRAVEL;


/*
  Per beat: the card arrives, the connector draws itself down the corridor and
  closes on its node, a sweep runs the row that changes, and — for the first two
  beats only — the whole cue and its line leave.

  Film C's rhythm is 2.40 / 2.28 / 3.84 with 1.60s of stillness at the end. Its
  20-millisecond beat boundaries leave no room for an exit, which this film
  needs because the cards share one slot and must not coexist. So each beat is
  given the exit time it needs and the total runs longer: 2.78 / 2.84 / 4.36,
  with the silence beat still comfortably the longest and its 1.60s of complete
  stillness intact (1.66s measured).

  `out` is absent from the third beat. That cue, its line and its node stay, and
  the film holds there — which is what Film C already does at t=9.0.
*/
const BEATS = [
  { /* Gmail    */ card:[1.20,1.52], wire:[1.58,2.10], node:[2.06,2.26],
                   sweep:[2.38,3.10], sweepOut:[3.10,3.34], out:[3.52,3.98] },
  { /* Calendar */ card:[4.14,4.46], wire:[4.52,5.10], node:[5.06,5.26],
                   sweep:[5.38,6.10], sweepOut:[6.10,6.34], out:[6.52,6.98] },
  { /* Silence  */ card:[7.14,7.54], wire:[7.62,8.32], node:[8.28,8.52],
                   sweep:[8.68,9.58], sweepOut:[9.58,9.84],
                   /* Was `null` — the silence cue used to stay because the film
                      held on it. It has to leave for the loop to seam, and it
                      leaves with the wipe rather than before it, so the last
                      thing to go is the thing the beat is about. */
                   out:[11.50,11.90] },
];

/* Everything after 9.84 is stillness: not one property on the canvas changes
   between there and the hold. That is the beat, and it is why the film is
   eleven and a half seconds rather than nine and a half. */
const STILL_FROM = 9.84;

const cl = u => u < 0 ? 0 : u > 1 ? 1 : u;
const ss = u => { u = cl(u); return u*u*(3-2*u); };
const seg = (t,[a,b]) => ss((t-a)/(b-a));
const band = (t,i,o) => o ? Math.min(seg(t,i), 1 - seg(t,o)) : seg(t,i);

/*
  How far a cell has moved from its opening value to its ratified one. It
  advances when the sweep's leading edge reaches it, and it retreats when the
  wipe bar passes back over it in the other direction.
*/
const FLIP_DUR = 0.26;

/* A cell REPLACES its value. The old one is gone before the new one starts,
   with a beat of empty cell between them, which is also what a spreadsheet
   cell actually does. */
const outOpacity = m => 1 - ss(m / 0.42);
const inOpacity  = m => ss((m - 0.52) / 0.48);

function mix(t, beat, key){
  const B = BEATS[beat];
  /* In `out` the edge starts at the split, so a column's progress is its
     distance from the split. In `in` the edge starts at the sheet's right edge,
     so it is the distance back from there. Same anchor, measured from the end
     the edge actually comes from. */
  const u  = sweepMode === "out" ? FLIP_X[key] / SWEEP_W
                                 : (SWEEP_W - FLIP_X[key]) / SWEEP_W;
  const at = B.sweep[0] + (B.sweep[1] - B.sweep[0]) * u;
  const advance = seg(t, [at, at + FLIP_DUR]);

  /* The row is handed back whole, when the wipe bar's centre reaches it.
     Every cell in the row shares this instant. */
  const w0 = WIPE[0] + (WIPE[1] - WIPE[0]) * wipeAt(CUES[beat].row);
  const retreat = seg(t, [w0, w0 + WIPE_RAMP]);
  return cl(advance - retreat);
}

function render(t){
  /* Wrapped rather than clamped: the film loops, so there is no end to hold at
     and `?t=` stays deterministic for any value. */
  const T = ((t % DUR) + DUR) % DUR;

  /* ------------------------------------------------- cue cards and wires */
  BEATS.forEach((B, i) => {
    const live = band(T, B.card, B.out);
    cardEls[i].style.opacity = live;
    cardEls[i].style.transform = `translateY(${(1-live) * 6}px)`;

    const w = wires[i];
    /* The line draws itself from the card down to the sheet, one continuous
       stroke through its single right angle. */
    const drawn = seg(T, B.wire);
    w.path.style.strokeDashoffset = w.len * (1 - drawn);

    /* The node closes the connector where it meets the sheet, the way the
       hero's does. It overshoots by a tenth on arrival and settles, so the line
       reads as landing rather than as having always been there. */
    const n = seg(T, B.node);
    w.node.style.opacity = n;
    const s = n * (1.10 - 0.10 * ss(cl((n - 0.6) / 0.4)));
    w.node.setAttribute("transform",
      `translate(${SHEET_EDGE} ${ROW_MID[CUES[i].row]}) scale(${s}) translate(${-SHEET_EDGE} ${-ROW_MID[CUES[i].row]})`);

    w.g.style.opacity = B.out ? (1 - seg(T, B.out)) : 1;
  });

  /* ------------------------------------------------------------ the sweeps */
  const swept   = ROWS.map(() => 0);
  const sweptOp = ROWS.map(() => 0);
  BEATS.forEach((B, i) => {
    const r = CUES[i].row;
    swept[r]   = seg(T, B.sweep) * (seg(T, B.sweepOut) < 1 ? 1 : 0);
    sweptOp[r] = band(T, [B.sweep[0], B.sweep[0] + 0.06], B.sweepOut);
  });
  rowSweeps.forEach((s, r) => {
    s.style.width = (swept[r] * SWEEP_W) + "px";
    s.style.opacity = sweptOp[r];
  });

  /* --------------------------------------------------------- the cell moves */
  BEATS.forEach((B, i) => {
    const f = flips[CUES[i].row];
    for (const key in f) {
      const m = mix(T, i, key);
      const c = f[key];
      const o = outOpacity(m), n = inOpacity(m);
      c.va.style.opacity = o;
      c.va.style.transform = `translateY(${(1-o) * -6}px)`;
      c.vb.style.opacity = n;
      c.vb.style.transform = `translateY(${(1-n) * 6}px)`;
      /* A short breath on the cell that just moved, in the same yellow. It
         rises with the value and is gone well before the beat ends, so NOTHING
         IS LEFT MARKING THE ROW. */
      const heat = Math.sin(cl(m) * Math.PI) * 0.16;
      c.cell.style.background = heat > 0.001
        ? `rgba(201,162,39,${heat.toFixed(4)})` : "";
    }
  });

  /* The formula bar moves with the cell it points at, on the same instant. */
  const fm = mix(T, 0, "status");
  const fo = outOpacity(fm), fn = inOpacity(fm);
  fbar.va.style.opacity = fo;
  fbar.va.style.transform = `translateY(${(1-fo) * -6}px)`;
  fbar.vb.style.opacity = fn;
  fbar.vb.style.transform = `translateY(${(1-fn) * 6}px)`;

  /* ---------------------------------------------------------------- the wipe */
  const wv = seg(T, WIPE);
  wipeEl.style.opacity = band(T, [WIPE[0], WIPE[0] + 0.10], [WIPE[1] - 0.14, WIPE[1]]);
  wipeEl.style.transform = `translateY(${GRID_H - wv * WIPE_TRAVEL}px)`;
}

/* =========================================================================
   DRIVER

   The film plays once and holds. `t` is clamped at DUR rather than wrapped:
   there is no loop and no seam to make frame-exact.
   ========================================================================= */

let playing = true, t = 0, last = performance.now();
const scrub = $("scrub"), clock = $("clock"), play = $("play");
scrub.max = Math.round(DUR * 1000);

function frame(now){
  if (playing) {
    t += (now - last) / 1000;
    if (t >= DUR) t -= DUR;
    scrub.value = Math.round(t * 1000);
  }
  last = now;
  render(t);
  clock.textContent = t.toFixed(2) + " / " + DUR.toFixed(2);
  requestAnimationFrame(frame);
}

scrub.addEventListener("input", () => {
  playing = false; play.textContent = "Play"; t = +scrub.value / 1000;
});
play.addEventListener("click", () => {
  playing = !playing; play.textContent = playing ? "Pause" : "Play";
});

let trueSize = false;
let lastK = 1;
function fit(){
  const wrap = $("stagewrap"), hold = $("stagehold");
  const bare = document.body.classList.contains("bare");
  const pad = bare ? 0 : 110;
  const availW = innerWidth  - (bare ? 0 : 40);
  const availH = innerHeight - pad;
  /*
    A DEGENERATE VIEWPORT MUST NOT PRODUCE A NEGATIVE SCALE, and this is not a
    hypothetical. An iframe inside a `display:none` subtree reports `innerWidth`
    and `innerHeight` of 0 — which is exactly the pattern `hero-film.tsx` uses to
    keep the mobile film off desktop, `loading="lazy"` inside a `desk:hidden`
    wrapper. `Math.min(1, 0/1322, -110/432.5)` is `-0.254`, and a negative scale
    is a 180-degree rotation plus a mirror, not a small film. The frame would
    then paint the composition upside-down and backwards until something
    happened to fire a resize.

    So the last good scale is held until the viewport actually has a size, and
    the resize that gives it one does the fitting. Caught by the verification
    pass reading nonsense geometry out of a backgrounded tab.
  */
  const k = trueSize ? 1
    : (availW > 0 && availH > 0)
      ? Math.min(1, availW / 1322, availH / 432.5)
      : lastK;
  lastK = k;
  wrap.style.transform = `scale(${k})`;
  hold.style.width  = (1322 * k) + "px";
  hold.style.height = (432.5 * k) + "px";
}
addEventListener("resize", fit);

function swapSweep(){
  sweepMode = sweepMode === "out" ? "in" : "out";
  applySweepMode();
  render(t);
}

$("btnFit").addEventListener("click", () => { trueSize = !trueSize; fit(); });
$("btnSweep").addEventListener("click", swapSweep);
$("btnG").addEventListener("click", () => window.renderAt(2.90));
$("btnC").addEventListener("click", () => window.renderAt(5.90));
$("btnS").addEventListener("click", () => window.renderAt(9.20));
$("btnH").addEventListener("click", () => window.renderAt(DUR));

addEventListener("keydown", e => {
  const step = 1 / 30;
  if (e.code === "Space") { e.preventDefault(); play.click(); }
  else if (e.key === "ArrowRight") { window.renderAt(Math.min(t + step, DUR)); }
  else if (e.key === "ArrowLeft")  { window.renderAt(Math.max(t - step, 0)); }
  else if (e.key === "r") { t = 0; playing = true; play.textContent = "Pause"; last = performance.now(); }
  else if (e.key === "s") { swapSweep(); }
  else if (e.key === "c") { document.body.classList.toggle("bare"); fit(); }
  else if (e.key === "f") { trueSize = !trueSize; fit(); }
});

/*
  Deterministic single-frame access, for capture and for inspecting a beat.
  `render` is a pure function of t, so this gives exactly the frame the player
  would show. Exposed because requestAnimationFrame is throttled in a background
  tab and any capture tool would otherwise read a stale frame.
*/
window.renderAt = function (sec) {
  playing = false; play.textContent = "Play";
  t = Math.max(0, Math.min(DUR, sec));
  scrub.value = Math.round(t * 1000);
  render(t);
  clock.textContent = t.toFixed(2) + " / " + DUR.toFixed(2);
  return t;
};

/*
  Embedded use.

    ?bare=1        strips the controls and the ground so the film sits in the
                   page as an asset rather than as a player
    ?t=11.5        opens on one frame, deterministically. Any t from 9.84 to
                   11.50 is the held frame; 11.5 is the canonical still.
    ?sweep=in|out  the A/B, handled above

  All three compose.
*/
if (params.get("bare") !== null) document.body.classList.add("bare");
const q = params.get("t");

fit();
if (q !== null) {
  window.renderAt(+q);
} else if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  /* A reader who has asked for reduced motion gets the held frame rather than
     the film, even if the host forgot to serve them the still. `hero-film.tsx`
     does this by swapping the src; this is the same answer from the other end,
     and it costs nothing when the host has already handled it. */
  window.renderAt(DUR);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
